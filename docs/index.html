<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control financiero AIXA · Gestión económica de obras</title>
<link rel="icon" type="image/png" href="logo-aixa.png">
<link rel="apple-touch-icon" href="logo-aixa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
// Tema antes de dibujar la página (evita el destello claro). "auto" sigue al sistema.
(function(){ var p='auto'; try{ p=localStorage.getItem('obracontrol.tema')||'auto'; }catch(e){}
  var o = p==='oscuro' || (p==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-tema', o?'oscuro':'claro'); })();
</script>
<style>
:root{
  --ink:#0E1A23; --ink-2:#152532; --ink-3:#21384A;
  --paper:#F3F5F7; --surface:#FFFFFF; --surface-2:#F7F9FA;
  --line:#E2E7EB; --line-2:#EDF1F4;
  --text:#0E1A23; --muted:#5B6B77; --muted-2:#8A99A4;
  --obra:#E85D04; --obra-soft:#FDEFE5;
  --plano:#2A78D6; --plano-soft:#E9F2FC;
  /* Series de gráficos (validadas para daltonismo): ingresos, costos, margen */
  --s-ing:#2A78D6; --s-cos:#EB6834; --s-mar:#6250D6;
  --verde:#13795B; --verde-soft:#E6F4EE;
  --rojo:#C0362C; --rojo-soft:#FCEBEA;
  --amarillo:#B7791F; --amarillo-soft:#FFF5E1;
  --r:8px; --r-lg:12px;
  --sombra:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --sombra-lg:0 16px 40px rgba(16,24,40,.14);
  /* Paleta categórica (orden fijo, validado para daltonismo en pares contiguos) */
  --c1:#2A78D6; --c2:#EB6834; --c3:#1BAF7A; --c4:#EDA100; --c5:#E87BA4; --c6:#008300; --c7:#6250D6; --c8:#E34948;
  --pista:#EDF1F4; --borde-input:#D5DDE3; --borde-hover:#C9D2D9; --chip:#F1F4F6; --hover:#F9FAFB; --text-2:#3F4E59;
  --topbar:rgba(255,255,255,.86); --hero-score:linear-gradient(180deg,#FBFCFD,#F5F8FA); --tooltip:#0E1A23; --cero:#9AA8B2;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sidebar:236px;
  color-scheme:light;
}
/* Tema oscuro: se activa por elección del usuario o, en "automático", según el sistema.
   Los colores de las series son los pasos oscuros de la misma paleta, validados contra esta superficie. */
:root[data-tema="oscuro"]{
  --paper:#0D161D; --surface:#17232D; --surface-2:#1C2934;
  --line:#2A3946; --line-2:#22313D;
  --text:#E8EEF2; --muted:#93A5B1; --muted-2:#6F8391; --text-2:#C3D0D8;
  --obra-soft:#3A2416; --plano:#4B92E8; --plano-soft:#18304A;
  --s-ing:#3987E5; --s-cos:#D95926; --s-mar:#9085E9;
  --c1:#3987E5; --c2:#D95926; --c3:#199E70; --c4:#C98500; --c5:#D55181; --c6:#008300; --c7:#9085E9; --c8:#E66767;
  --verde:#3DBB8C; --verde-soft:#15342A; --rojo:#F07167; --rojo-soft:#3B1D1C; --amarillo:#E3B045; --amarillo-soft:#3A2E15;
  --pista:#26343F; --borde-input:#33444F; --borde-hover:#465B69; --chip:#25333E; --hover:#1E2C37;
  --topbar:rgba(23,35,45,.86); --hero-score:linear-gradient(180deg,#1A2731,#16222B); --tooltip:#2C3D4A; --cero:#5D7180;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.25); --sombra-lg:0 16px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--plano)}
:focus-visible{outline:2px solid var(--obra);outline-offset:2px}
::selection{background:var(--obra);color:#fff}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.sidebar{background:var(--ink);color:#DCE6E9;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .mark{font-weight:600;font-size:15.5px;letter-spacing:-.01em;color:#fff;display:flex;align-items:center;gap:11px;line-height:1.2}
.brand .mark img{display:block;width:34px;height:34px;flex:none;border-radius:9px;object-fit:contain;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.brand .co{font-size:12px;color:var(--muted-2);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{flex:1;overflow-y:auto;padding:10px 12px}
.nav .grp{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#5F7684;padding:16px 10px 6px}
.nav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:0;padding:9px 10px;border-radius:var(--r);color:#B9C8CF;cursor:pointer;text-align:left;position:relative;font-size:13.5px;font-weight:500;transition:background .12s,color .12s}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:rgba(255,255,255,.09);color:#fff;font-weight:600}
.nav button.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--obra)}
.nav button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nav button.on svg{opacity:1;color:#FFB27F}
.sidefoot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:#7F96A2;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sidefoot button{background:none;border:0;color:#9FB2BB;cursor:pointer;font-size:11.5px}
.sidefoot button:hover{color:#fff}
#storeInfo::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--topbar);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:0 28px;height:66px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:19px;font-weight:600;letter-spacing:-.015em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumb{font-size:12px;font-weight:500;color:var(--muted);display:block;margin-bottom:1px;letter-spacing:0}
.usuario{display:flex;align-items:center;gap:9px;padding-left:14px;margin-left:4px;border-left:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap}
.usuario .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#E85D04,#F59E4B);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12.5px;letter-spacing:.02em}
.usuario b{display:block;color:var(--text);font-weight:600;font-size:12.5px}
.wrap{padding:26px 28px 64px;max-width:1480px;width:100%}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;cursor:pointer}

/* ---------- Piezas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sombra)}
.card-h{padding:16px 20px 12px;display:flex;align-items:center;gap:12px}
.card-h h2{font-size:14.5px;font-weight:600;flex:1;letter-spacing:-.005em}
.card-h .sub{font-size:12px;color:var(--muted)}
.card-b{padding:8px 20px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.push{margin-left:auto}
.sep{height:1px;background:var(--line-2);margin:14px 0}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--sombra)}
.kpi .lab{font-size:12.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.acc .lab::before,.kpi.acc-b .lab::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--s-cos)}
.kpi.acc-b .lab::before{background:var(--s-ing)}
.pos{color:var(--verde)} .neg{color:var(--rojo)} .neu{color:var(--muted)}

/* Tablero ejecutivo */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0;padding:0;overflow:hidden}
.hero-main{padding:24px 26px;border-right:1px solid var(--line-2)}
.hero-main .lab{font-size:13px;font-weight:500;color:var(--muted)}
.hero-main .big{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:8px 0 10px;font-variant-numeric:tabular-nums}
.hero-main .desc{font-size:13.5px;color:var(--muted);line-height:1.55;max-width:60ch}
.hero-main .desc b{color:var(--text);font-weight:600}
.cascada{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.cascada div{border-top:2px solid var(--line);padding-top:9px}
.cascada span{display:block;font-size:12px;color:var(--muted)}
.cascada b{display:block;font-size:15px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero-score{padding:22px 24px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--hero-score)}
.score{position:relative;width:132px;height:132px}
.score svg{width:132px;height:132px;transform:rotate(-90deg)}
.score .n{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.score .n b{font-size:36px;font-weight:600;letter-spacing:-.03em;line-height:1}
.score .n span{font-size:11.5px;color:var(--muted);margin-top:4px}
.factores{display:grid;gap:9px}
.factores .t{font-size:13px;font-weight:600;margin-bottom:2px}
.factor{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px;color:var(--muted)}
.factor .bar-line{grid-column:1/-1;margin-top:0;height:5px}
.factor b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

.tile{display:flex;flex-direction:column}
.tile .val{font-size:24px}
.tile .fila{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:6px}
.spark{width:96px;height:34px;flex:none;overflow:visible}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;font-variant-numeric:tabular-nums}
.delta.up{background:var(--verde-soft);color:var(--verde)}
.delta.down{background:var(--rojo-soft);color:var(--rojo)}
.delta.flat{background:var(--chip);color:var(--muted)}

.alertas{display:flex;flex-direction:column}
.alerta{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line-2);cursor:default}
.alerta:first-child{border-top:0;padding-top:4px}
.alerta[data-ir]{cursor:pointer}
.alerta[data-ir]:hover .tt{color:var(--plano)}
.alerta .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.alerta .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.alerta.critico .ic{background:var(--rojo-soft);color:var(--rojo)}
.alerta.atencion .ic{background:var(--amarillo-soft);color:var(--amarillo)}
.alerta.ok .ic{background:var(--verde-soft);color:var(--verde)}
.alerta.info .ic{background:var(--plano-soft);color:var(--plano)}
.alerta .tt{font-size:13px;font-weight:600;line-height:1.35}
.alerta .dd{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.alerta .tag{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;padding-top:2px}
.alerta.critico .tag{color:var(--rojo)} .alerta.atencion .tag{color:var(--amarillo)}

.medidor{margin-top:6px}
.medidor .pista{position:relative;height:10px;border-radius:99px;background:var(--pista);overflow:visible}
.medidor .relleno{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.medidor .marca{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--text);border-radius:2px}
.medidor .ejes{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.dato{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:9px 0;border-top:1px solid var(--line-2)}
.dato:first-of-type{border-top:0}
.dato span{color:var(--muted)}
.dato b{font-weight:600;font-variant-numeric:tabular-nums}

.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.chart .grilla{stroke:var(--pista);stroke-width:1}
.chart .eje{stroke:var(--borde-input);stroke-width:1}
[data-tip]{cursor:default}
.tooltip{position:fixed;z-index:150;pointer-events:none;background:var(--tooltip);color:#fff;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.5;box-shadow:var(--sombra-lg);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:280px}
.tooltip.on{opacity:1;transform:none}
.tooltip b{font-weight:600}
.tooltip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

.progreso{display:flex;align-items:center;gap:8px;min-width:120px}
.progreso .bar-line{flex:1;margin:0}
.progreso span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:38px;text-align:right}
.segmentos{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px}
.segmentos button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.segmentos button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.1)}
.segmentos button b{font-weight:600;margin-left:4px;color:var(--muted-2)}
.buscar{position:relative}
.buscar input{border:1px solid var(--borde-input);border-radius:var(--r);padding:8px 11px 8px 32px;font-size:13px;width:240px;background:var(--surface)}
.buscar svg{position:absolute;left:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);stroke:var(--muted-2);fill:none;stroke-width:2}
.nombre-obra{font-weight:600;min-width:200px}
.nombre-obra small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:1px}
.saludo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.saludo h2{font-size:22px;font-weight:600;letter-spacing:-.02em}
.saludo p{font-size:13.5px;color:var(--muted);margin-top:3px}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:.12s;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.btn:hover{border-color:var(--borde-hover);background:var(--surface-2)}
.btn:disabled{opacity:.6;cursor:default}
.btn.pri{background:var(--obra);border-color:var(--obra);color:#fff;box-shadow:0 1px 2px rgba(16,24,40,.08),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri:hover{background:#CE5203;border-color:#CE5203}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:var(--ink-2)}
.btn.dgr{color:var(--rojo);border-color:var(--rojo-soft);background:var(--rojo-soft)}
.btn.dgr:hover{background:#F4D8D4;border-color:var(--rojo)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico{background:none;border:0;cursor:pointer;padding:5px;border-radius:var(--r);color:var(--muted);line-height:0}
.ico:hover{background:var(--surface-2);color:var(--text)}
.ico.d:hover{background:var(--rojo-soft);color:var(--rojo)}
.ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;font-size:14px;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--obra);font-weight:600}

/* Tablas */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.act{text-align:right;white-space:nowrap;width:1%}
.click{cursor:pointer}
.click td:first-child{font-weight:600}
tfoot td{border-top:1px solid var(--line);border-bottom:0;font-weight:600;background:var(--surface-2)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 9px 3px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap;line-height:1.5}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.o{background:var(--obra-soft);color:#B4480A}
.chip.b{background:var(--plano-soft);color:#1F5FAE}
.chip.g{background:var(--verde-soft);color:var(--verde)}
.chip.r{background:var(--rojo-soft);color:var(--rojo)}
.chip.y{background:var(--amarillo-soft);color:#8A5A0B}

/* Form */
.fld{display:block;margin-bottom:14px}
.fld > span{display:block;font-size:12.5px;font-weight:500;color:var(--text-2);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--borde-input);border-radius:var(--r);padding:9px 11px;background:var(--surface);font-size:13.5px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--plano);outline:none;box-shadow:0 0 0 3px var(--plano-soft)}
.fld input[type=number]{font-variant-numeric:tabular-nums;text-align:right}
.fld textarea{min-height:64px;resize:vertical}
.fld .hint{font-size:11px;color:var(--muted);margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;padding:9px 0}
.chk input{width:16px;height:16px;accent-color:var(--obra)}
.chk span{font-size:13.5px}
.ff{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.ff .full{grid-column:1/-1}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(14,26,35,.5);display:none;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:100;overflow-y:auto;backdrop-filter:blur(4px)}
.ov.on{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;box-shadow:var(--sombra-lg);animation:up .2s cubic-bezier(.2,.8,.2,1)}
.modal.wide{max-width:820px}
@keyframes up{from{transform:translateY(12px) scale(.985);opacity:0}to{transform:none;opacity:1}}

<script type="module">
/* =========================================================
   Control financiero AIXA — gestión económica de obras, vehículos y estructura
   Datos: nube (Firebase), en memoria mientras hay sesión + respaldo JSON.
   Capa Store aislada para poder migrar a Firebase/Supabase sin tocar la app.
   ========================================================= */
'use strict';

const KEY = 'obracontrol.v1';
const DEF = {
  config:{empresa:'Mi empresa', moneda:'ARS', tasa:60, margenObj:25, ivaOn:false, saldoInicial:0, diaPagoFijos:10},
  updatedAt:0,
  obras:[], ingresos:[], costos:[],
  vehiculos:[], cargas:[], vgastos:[],
  fijos:[], planes:[], previsiones:[],
  informes:[]   // informes con IA generados (se guardan los últimos)
};

// Valida y limpia datos que llegan de afuera (respaldo, nube o navegador) antes de usarlos.
// Si no tienen la forma esperada lanza un error y no se toca nada.
const COLS = Object.keys(DEF).filter(k=>Array.isArray(DEF[k]));
const esObj = x => x!==null && typeof x==='object' && !Array.isArray(x);
function normalizar(p){
  if(!esObj(p)) throw new Error('formato inválido');
  if(!COLS.some(k=>Array.isArray(p[k])) && !esObj(p.config)) throw new Error('no parece un respaldo de este sistema');
  const base = structuredClone(DEF);
  COLS.forEach(k=>{
    base[k] = (Array.isArray(p[k])?p[k]:[]).filter(esObj).map(o=>{
      const r = {...o};
      if(typeof r.id!=='string' || !r.id) r.id = uid();
      // las fechas se leen con .slice(); un valor que no sea texto rompería las pantallas
      Object.keys(r).forEach(c=>{ if(/^(fecha|desde|hasta)/i.test(c) && r[c]!=null && typeof r[c]!=='string') r[c]=''; });
      return r;
    });
  });
  base.config = Object.assign(structuredClone(DEF.config), esObj(p.config)?p.config:{});
  base.updatedAt = num(p.updatedAt);
  return base;
}

const Store = {
  // Los datos viven en la nube: acá solo hay una copia en memoria mientras la sesión está abierta.
  // "previos" son datos que versiones anteriores dejaban guardados en el navegador; se revisan al entrar.
  data:null, previos:null,
  load(){
    this.data = structuredClone(DEF);
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){ const p=normalizar(JSON.parse(raw)); if(COLS.some(k=>p[k].length)) this.previos=p; }
    }catch(e){}
    return this.data;
  },
  save(silencioso, fecha){
    this.data.updatedAt = fecha || Date.now();
    if(!silencioso) Cloud.programarSubida();
  },
  col(n){ return this.data[n]; },
  add(n,o){ o.id = uid(); this.data[n].push(o); this.save(); return o; },
  upd(n,id,o){ const i=this.data[n].findIndex(x=>x.id===id); if(i>-1){ this.data[n][i]=Object.assign(this.data[n][i],o); this.save(); } },
  del(n,id){ this.data[n]=this.data[n].filter(x=>x.id!==id); this.save(); },
  get(n,id){ return this.data[n].find(x=>x.id===id); }
};
const D = () => Store.data;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- Formato ---------- */
const nf = new Intl.NumberFormat('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
function money(v,dec){ if(v==null||isNaN(v)) return '—'; const s=(dec?nf2:nf).format(Math.abs(v)); return (v<0?'-$ ':'$ ')+s; }
function pct(v,dec=1){ if(v==null||!isFinite(v)) return '—'; return v.toFixed(dec).replace('.',',')+' %'; }
function days(v){ if(v==null||!isFinite(v)) return '—'; return Math.round(v)+' d'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sign(v){ return v>0?'pos':v<0?'neg':'neu'; }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }

const DAY = 86400000;
function dt(s){ if(!s) return null; const d=new Date(s+'T12:00:00'); return isNaN(d)?null:d; }
function fdate(s){ if(!s) return '—'; const d=dt(s); return d? d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—'; }
function diffDays(a,b){ const x=dt(a), y=dt(b); if(!x||!y) return null; return Math.round((y-x)/DAY); }
function today(){ return new Date().toISOString().slice(0,10); }
function monthKey(s){ return s? s.slice(0,7) : ''; }
function monthLabel(k){ const [y,m]=k.split('-'); return ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m-1]+' '+y.slice(2); }

/* ---------- Finanzas ---------- */
// VAN con fechas reales (XNPV). flows: [{d:'YYYY-MM-DD', m:number}]
function xnpv(rate, flows){
  if(!flows.length) return 0;
  const f=[...flows].sort((a,b)=>a.d<b.d?-1:1);
  const t0=dt(f[0].d);
  return f.reduce((s,x)=> s + x.m/Math.pow(1+rate,(dt(x.d)-t0)/(365*DAY)), 0);
}
// TIR con fechas reales (XIRR) por bisección — robusto, sin divergencias
function xirr(flows){
  if(flows.length<2) return null;
  if(!flows.some(f=>f.m>0) || !flows.some(f=>f.m<0)) return null;
  const f=r=>xnpv(r,flows);
  let lo=-0.9999, hi=10, flo=f(lo), fhi=f(hi), it=0;
  while(flo*fhi>0 && it<40){ hi*=2; fhi=f(hi); it++; if(hi>1e6) return null; }
  if(flo*fhi>0) return null;
  for(let i=0;i<160;i++){ const mid=(lo+hi)/2, fm=f(mid); if(flo*fm<=0){hi=mid;fhi=fm;} else {lo=mid;flo=fm;} }
  return (lo+hi)/2;
}
// Días promedio ponderados por monto desde una fecha base
function plazoPond(items, baseDate, getDate, getMonto){
  let sm=0, sd=0;
  items.forEach(x=>{ const m=Math.abs(num(getMonto(x))), d=diffDays(baseDate,getDate(x)); if(m>0 && d!=null){ sm+=m; sd+=m*d; } });
  return sm>0 ? sd/sm : null;
}
// Curva de caja acumulada -> pico de necesidad de capital
function curvaCaja(flows){
  const f=[...flows].sort((a,b)=>a.d<b.d?-1:1);
  let acc=0, min=0, pts=[];
  f.forEach(x=>{ acc+=x.m; if(acc<min) min=acc; pts.push({d:x.d,acc}); });
  return {pts, pico: min, final: acc};
}

/* ---------- Datos derivados de obra ---------- */
const CAT_COSTO = ['Materiales','Mano de obra','Subcontratos','Combustible','Fletes','Herramientas','Alquiler equipos','Impuestos','Otros'];
const CAT_ING   = ['Adelanto','Certificado','Saldo final','Adicional','Otro'];
const TIPO_VG   = ['Peaje','Service','Reparación','Cubiertas','VTV','Seguro','Patente','Lavado','Estacionamiento','Multa','Repuestos','Otro'];
const PERIODOS  = {mensual:1, bimestral:2, trimestral:3, cuatrimestral:4, semestral:6, anual:12};
const ESTADOS   = ['Presupuestada','En ejecución','Entregada','Cobrada','Cancelada'];

function ingresosDe(id){ return D().ingresos.filter(x=>x.obraId===id); }
function costosDe(id){ return D().costos.filter(x=>x.obraId===id); }

function analizarObra(o){
  const ing = ingresosDe(o.id), cos = costosDe(o.id);
  const cobrado = ing.reduce((s,x)=>s+num(x.monto),0);
  const costoTot = cos.reduce((s,x)=>s+num(x.monto),0);
  const costoPagado = cos.filter(x=>x.pagado).reduce((s,x)=>s+num(x.monto),0);
  const presup = num(o.presupuesto);
  const margen = cobrado - costoTot;
  const rent = cobrado>0 ? margen/cobrado*100 : null;      // rentabilidad sobre venta
  const roi  = costoTot>0 ? margen/costoTot*100 : null;    // retorno sobre lo invertido
  // Meta de rentabilidad (ROI) elegida para esta obra: 0 o vacío = sin meta fijada
  const metaRoi = num(o.metaRoi)||0;
  const brechaRoi = (metaRoi>0 && roi!=null) ? roi-metaRoi : null;          // puntos porcentuales vs la meta
  const metaCumplida = brechaRoi==null ? null : brechaRoi>=0;
  const margenObjetivo = metaRoi>0 ? costoTot*metaRoi/100 : null;          // margen que hacía falta para cumplirla
  const brechaMonto = margenObjetivo!=null ? margen-margenObjetivo : null; // diferencia en pesos
  const desvio = presup>0 ? (cobrado-presup)/presup*100 : null;
  const desvioCosto = presup>0 ? costoTot/presup*100 : null;
  const adelantos = ing.filter(x=>x.tipo==='Adelanto');
  const adelanto = adelantos.reduce((s,x)=>s+num(x.monto),0);
  const pctAdelanto = presup>0 ? adelanto/presup*100 : null;

  const entrega = o.fechaEntrega || o.fechaEntregaPrev;
  const plazoEjec = diffDays(o.fechaAceptacion, o.fechaEntrega);
  const plazoEjecPrev = diffDays(o.fechaAceptacion, o.fechaEntregaPrev);
  const atraso = (plazoEjec!=null && plazoEjecPrev!=null) ? plazoEjec-plazoEjecPrev : null;

  // Plazos ponderados desde la aceptación (base común para comparar cobros vs pagos)
  const cobroDesdeAcep = plazoPond(ing, o.fechaAceptacion, x=>x.fecha, x=>x.monto);
  const pagosHechos = cos.filter(x=>x.pagado && x.fechaPago);
  const pagoDesdeAcep = plazoPond(pagosHechos, o.fechaAceptacion, x=>x.fechaPago, x=>x.monto);
  const brecha = (cobroDesdeAcep!=null && pagoDesdeAcep!=null) ? cobroDesdeAcep-pagoDesdeAcep : null;
  // Plazo de cobro medido desde la entrega (lo que normalmente se llama "plazo de cobro")
  const cobroDesdeEntrega = entrega ? plazoPond(ing.filter(x=>x.tipo!=='Adelanto'), entrega, x=>x.fecha, x=>x.monto) : null;
  // Plazo de pago a proveedores: días entre la fecha del costo y su pago
  const plazoProv = (()=>{
    let sm=0,sd=0;
    pagosHechos.forEach(x=>{ const m=Math.abs(num(x.monto)), d=diffDays(x.fecha,x.fechaPago); if(m>0&&d!=null){sm+=m;sd+=m*d;} });
    return sm>0? sd/sm : null;
  })();

  const flows = flujosObra(o);
  const caja = curvaCaja(flows);
  const tasa = num(D().config.tasa)/100;
  const van = flows.length>1 ? xnpv(tasa, flows) : null;
  const tir = xirr(flows);
  const cobrable = presup>0 ? Math.max(presup-cobrado,0) : 0;
  const porPagar = costoTot - costoPagado;
  const payback = paybackDias(flows);
  // Rendimiento anualizado sobre el capital que la empresa realmente inmovilizó
  const diasCiclo = flows.length>1 ? Math.max(diffDays(flows[0].d, flows[flows.length-1].d)||1,1) : null;
  const retAnual = (caja.pico<0 && diasCiclo) ? (margen/Math.abs(caja.pico))*(365/diasCiclo)*100 : null;
  // Cuando el cliente financia la obra entera no existe TIR clásica: no hay inversión neta que recuperar
  const tirNota = tir!=null ? null
    : (flows.length<2 ? 'Cargá al menos un cobro y un pago con fecha'
    : (margen>0 ? 'La obra se financió sola: no hay TIR clásica' : 'Los flujos no permiten calcularla'));

  return {ing,cos,cobrado,costoTot,costoPagado,porPagar,presup,margen,rent,roi,desvio,desvioCosto,
          metaRoi,brechaRoi,metaCumplida,margenObjetivo,brechaMonto,
          adelanto,pctAdelanto,plazoEjec,plazoEjecPrev,atraso,cobroDesdeAcep,pagoDesdeAcep,brecha,
          cobroDesdeEntrega,plazoProv,flows,caja,van,tir,cobrable,payback,entrega,retAnual,tirNota,diasCiclo};
}

function flujosObra(o){
  const f=[];
  ingresosDe(o.id).forEach(x=>{ if(x.fecha) f.push({d:x.fecha,m:num(x.monto),t:'i',ref:x}); });
  costosDe(o.id).forEach(x=>{ const d = x.pagado&&x.fechaPago ? x.fechaPago : x.fecha; if(d) f.push({d,m:-num(x.monto),t:'c',ref:x}); });
  return f.sort((a,b)=>a.d<b.d?-1:1);
}
function paybackDias(flows){
  if(!flows.length) return null;
  const f=[...flows].sort((a,b)=>a.d<b.d?-1:1);
  let acc=0, minAcc=0, minD=null;
  for(const x of f){ acc+=x.m; if(acc<minAcc){minAcc=acc;minD=x.d;} }
  if(minAcc>=0) return 0;
  acc=0;
  for(const x of f){ acc+=x.m; if(acc>=0 && x.d>=minD) return diffDays(f[0].d,x.d); }
  return null;
}

/* ---------- Gastos fijos / estructura ---------- */
function fijoMensual(f){ const p=PERIODOS[f.periodicidad]||1; return num(f.monto)/p; }
function totalFijoMensual(){ return D().fijos.filter(f=>f.activo!==false).reduce((s,f)=>s+fijoMensual(f),0); }

/* ---------- Vehículos ---------- */
function analizarVehiculo(v){
  const cargas = D().cargas.filter(c=>c.vehiculoId===v.id).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const gastos = D().vgastos.filter(g=>g.vehiculoId===v.id);
  const litros = cargas.reduce((s,c)=>s+num(c.litros),0);
  const gastoComb = cargas.reduce((s,c)=>s+num(c.importe),0);
  const gastoOtros = gastos.reduce((s,g)=>s+num(g.monto),0);
  const total = gastoComb+gastoOtros;
  const odos = cargas.filter(c=>num(c.odometro)>0).map(c=>num(c.odometro));
  const kmRecorridos = odos.length>1 ? Math.max(...odos)-Math.min(...odos) : 0;
  // Consumo: litros cargados entre la primera y la última carga (se descarta la primera carga)
  let litrosConsumo = 0;
  if(cargas.length>1){ litrosConsumo = cargas.slice(1).reduce((s,c)=>s+num(c.litros),0); }
  const consumo = (kmRecorridos>0 && litrosConsumo>0) ? kmRecorridos/litrosConsumo : null; // km/l
  const l100 = consumo ? 100/consumo : null;
  const costoKm = kmRecorridos>0 ? total/kmRecorridos : null;
  const precioLitro = litros>0 ? gastoComb/litros : null;
  const ultOdo = odos.length? Math.max(...odos) : num(v.odoInicial);
  return {cargas,gastos,litros,gastoComb,gastoOtros,total,kmRecorridos,consumo,l100,costoKm,precioLitro,ultOdo};
}

/* ---------- Plan de costos por rubro (presupuestado vs real) ---------- */
function planDe(obraId){ return D().planes.filter(p=>p.obraId===obraId); }
function compararRubros(o){
  const plan=planDe(o.id), cos=costosDe(o.id);
  const rubros=[...new Set([...plan.map(p=>p.rubro), ...cos.map(c=>c.categoria||'Sin categoría')])];
  const filas=rubros.map(r=>{
    const pre=plan.filter(p=>p.rubro===r).reduce((s,p)=>s+num(p.monto),0);
    const real=cos.filter(c=>(c.categoria||'Sin categoría')===r).reduce((s,c)=>s+num(c.monto),0);
    const desv=real-pre;
    return {rubro:r, pre, real, desv, desvPct: pre>0? desv/pre*100 : null, consumo: pre>0? real/pre*100 : null,
            planId:(plan.find(p=>p.rubro===r)||{}).id||null};
  }).sort((a,b)=>b.real-a.real);
  const totPre=filas.reduce((s,f)=>s+f.pre,0), totReal=filas.reduce((s,f)=>s+f.real,0);
  return {filas, totPre, totReal, desv: totReal-totPre, desvPct: totPre>0?(totReal-totPre)/totPre*100:null};
}

/* ---------- Proyección de caja ---------- */
function plazoCobroProm(){
  let sm=0,sd=0;
  D().obras.forEach(o=>{ const e=o.fechaEntrega||o.fechaEntregaPrev; if(!e) return;
    ingresosDe(o.id).filter(i=>i.tipo!=='Adelanto').forEach(i=>{const d=diffDays(e,i.fecha),m=num(i.monto); if(d!=null&&d>=0&&m>0){sm+=m;sd+=m*d;}}); });
  return sm>0? Math.round(sd/sm) : 30;
}
function plazoPagoProm(){
  let sm=0,sd=0;
  D().costos.filter(c=>c.pagado&&c.fechaPago).forEach(c=>{const d=diffDays(c.fecha,c.fechaPago),m=num(c.monto); if(d!=null&&d>=0&&m>0){sm+=m;sd+=m*d;}});
  return sm>0? Math.round(sd/sm) : 15;
}
function sumarDias(f,n){ const d=dt(f)||new Date(); return new Date(d.getTime()+n*DAY).toISOString().slice(0,10); }

function proyectarCaja(horizonte=90){
  const hoy=today(), fin=sumarDias(hoy,horizonte);
  const ev=[];
  const dsoP=plazoCobroProm(), dpoP=plazoPagoProm();

  // Saldos por cobrar de obras vivas
  D().obras.filter(o=>o.estado!=='Cancelada'&&o.estado!=='Cobrada').forEach(o=>{
    const a=analizarObra(o);
    if(a.cobrable<=0) return;
    let f = o.fechaCobroPrev || (o.fechaEntrega? sumarDias(o.fechaEntrega,dsoP) : o.fechaEntregaPrev? sumarDias(o.fechaEntregaPrev,dsoP) : sumarDias(hoy,dsoP));
    if(f<hoy) f=hoy;
    ev.push({fecha:f, m:a.cobrable, concepto:'Saldo a cobrar · '+o.nombre, origen:'Obra', cierto:!!o.fechaCobroPrev, ref:{v:'obra',id:o.id}});
  });

  // Costos cargados sin pagar
  D().costos.filter(c=>!c.pagado).forEach(c=>{
    let f = c.vence || sumarDias(c.fecha,dpoP);
    if(f<hoy) f=hoy;
    const o=Store.get('obras',c.obraId);
    ev.push({fecha:f, m:-num(c.monto), concepto:(c.concepto||c.categoria||'Costo')+(o?' · '+o.nombre:''), origen:'Proveedor', cierto:!!c.vence, ref:c.obraId?{v:'obra',id:c.obraId}:null});
  });

  // Estructura: se paga todos los meses
  const fijo=totalFijoMensual(), dia=Math.min(28,Math.max(1,num(D().config.diaPagoFijos)||10));
  if(fijo>0){
    let cur=new Date(dt(hoy).getFullYear(), dt(hoy).getMonth(), dia, 12);
    for(let i=0;i<6;i++){
      const f=cur.toISOString().slice(0,10);
      if(f>=hoy && f<=fin) ev.push({fecha:f, m:-fijo, concepto:'Gastos fijos de estructura', origen:'Estructura', cierto:true});
      cur=new Date(cur.getFullYear(), cur.getMonth()+1, dia, 12);
    }
  }

  // Previsiones cargadas a mano
  D().previsiones.forEach(p=>{
    if(p.fecha>=hoy && p.fecha<=fin)
      ev.push({fecha:p.fecha, m:(p.tipo==='Egreso'?-1:1)*num(p.monto), concepto:p.concepto||p.tipo, origen:'Previsión', cierto:true, id:p.id});
  });

  const eventos=ev.filter(e=>e.fecha<=fin).sort((a,b)=>a.fecha<b.fecha?-1:1);

  // Agrupado por semana
  const saldo0=num(D().config.saldoInicial);
  let acc=saldo0;
  const semanas=[];
  for(let i=0;i<Math.ceil(horizonte/7);i++){
    const ini=sumarDias(hoy,i*7), f2=sumarDias(hoy,i*7+6);
    const dentro=eventos.filter(e=>e.fecha>=ini&&e.fecha<=f2);
    const inn=dentro.filter(e=>e.m>0).reduce((s,e)=>s+e.m,0);
    const out=-dentro.filter(e=>e.m<0).reduce((s,e)=>s+e.m,0);
    acc+=inn-out;
    semanas.push({ini,fin:f2,inn,out,neto:inn-out,acc,n:dentro.length});
  }
  const pts=[{d:hoy,acc:saldo0},...semanas.map(s=>({d:s.fin,acc:s.acc}))];
  const minimo=Math.min(saldo0,...semanas.map(s=>s.acc));
  const primeraRoja=semanas.find(s=>s.acc<0)||null;
  return {eventos,semanas,pts,saldo0,minimo,primeraRoja,final:acc,dsoP,dpoP,
          totalIn:eventos.filter(e=>e.m>0).reduce((s,e)=>s+e.m,0),
          totalOut:-eventos.filter(e=>e.m<0).reduce((s,e)=>s+e.m,0)};
}

  // Al entrar, la nube manda. Solo se suben los datos del equipo si son de este mismo usuario y empresa
  // y quedaron cambios sin subir, o si la nube todavía está vacía (primera vez).
  // Al entrar se cargan los datos de la nube. Si el navegador tenía datos de versiones anteriores
  // (que guardaban una copia local), se suben si la nube está vacía o se descargan como respaldo.
  async sincronizarAlEntrar(){
    const snap = await this.fb.getDoc(this.ref());

    if(snap.exists()){
      if(previos) exportar('previo-al-ingreso', previos);

      Store.data = previos;

  async entrar(email, pass){

      // Las cuentas se crean a mano en la consola de Firebase: la app nunca registra usuarios nuevos,

      await this.fb.signInWithEmailAndPassword(this.auth, email, pass);
      return true;

      const msg={
        'auth/invalid-credential':'email o contraseña incorrectos (o la cuenta todavía no fue creada en Firebase)',

      }[e.code];
      toast('No se pudo entrar: '+(msg||e.code||e.message), true); return false;

  async recuperar(email){
    this.entrando=true;

    if(!this.auth) return false;
    try{ await this.fb.sendPasswordResetEmail(this.auth, email); }
    catch(e){
      if(e.code==='auth/invalid-email'){ toast('El email no es válido', true); return false; }
      if(e.code==='auth/network-request-failed'){ toast('Sin conexión a internet', true); return false; }

  // Aplica datos recibidos de la nube; si vienen dañados se ignoran y quedan los locales

    let datos;

    catch(e){ toast('Los datos de la nube están dañados; se conservan los de este equipo', true); return false; }
    Store.data=datos;
    Store.save(true, datos.updatedAt);        // conserva la fecha de la nube para comparar bien la próxima vez
    return true;
  },

  // Cierra la sesión; los datos siguen en la nube y se vuelven a ver al entrar
  async salir(){
    if(this.timer){ clearTimeout(this.timer); this.timer=null; await this.subir({auto:true}); }   // no perder lo último
    if(this.desuscribir){ this.desuscribir(); this.desuscribir=null; }
    this.limpiarEquipo();
    if(this.auth) await this.fb.signOut(this.auth);
  },

  ref(){ return this.fb.doc(this.db,'empresas',this.empresaId()); },

  // Escucha en vivo: si otro de los usuarios guarda algo, este equipo lo recibe al instante
  escuchar(){
    if(this.desuscribir) this.desuscribir();
    if(!this.user) return;
    this.desuscribir = this.fb.onSnapshot(this.ref(), snap=>{
      if(!snap.exists()) return;
      const d=snap.data();
      if(d.equipo===this.equipo()) return;              // es mi propia escritura
      if((d.updatedAt||0) <= (Store.data.updatedAt||0)) return;
      if(!this.aplicar(d.payload)) return;
      if(!ov.classList.contains('on')) render();        // no interrumpir si está editando algo
      toast('Actualizado por '+(d.autor||'otro usuario'));
    }, ()=>this.setEstado('error'));

  async subir({auto=false}={}){
    if(!this.user){ if(!auto) toast('Primero iniciá sesión en la nube', true); return false; }
    const payload = JSON.stringify(Store.data);
    const peso = new Blob([payload]).size;
    if(peso > this.LIMITE){
      this.setEstado('error');
      toast('Los datos superan el límite de la nube (1 MB). Descargá un respaldo y archivá obras viejas.', true);
      return false;
    }
    if(peso > this.AVISO && !this.avisado){ this.avisado=true; toast('Los datos ya ocupan '+Math.round(peso/1000)+' KB de 1000 KB en la nube', true); }
    try{
      this.setEstado('subiendo');
      await this.fb.setDoc(this.ref(), {
        payload,
        updatedAt: Store.data.updatedAt || Date.now(),
        empresa: Store.data.config.empresa || '',
        equipo: this.equipo(),
        autor: (this.user.email||'').split('@')[0],
        miembros: this.fb.arrayUnion ? this.fb.arrayUnion(this.user.uid) : [this.user.uid]
      }, {merge:true});
      this.setEstado('conectado');
      if(!auto) toast('Datos guardados en la nube');
      return true;
    }catch(e){ this.setEstado('error'); toast('No se pudo subir: '+(e.code||e.message), true); return false; }
  },

  async bajar({auto=false}={}){
    if(!this.user){ if(!auto) toast('Primero iniciá sesión en la nube', true); return false; }
    try{
      const snap = await this.fb.getDoc(this.ref());
      if(!snap.exists()){
        if(auto) return this.subir({auto:true});
        toast('Todavía no hay datos en la nube'); return false;
      }
      const d=snap.data();
      const remoto = d.updatedAt||0, local = Store.data.updatedAt||0;
      if(auto && remoto <= local){
        if(remoto < local) this.subir({auto:true});
        this.setEstado('conectado');
        return false;
      }
      if(!this.aplicar(d.payload)){ this.setEstado('error'); return false; }
      this.setEstado('conectado');
      toast(auto?'Datos actualizados desde la nube':'Datos bajados de la nube');
      render();
      return true;
    }catch(e){ this.setEstado('error'); toast('No se pudo bajar: '+(e.code||e.message), true); return false; }
  }
};

/* Constructor de formularios: fields = [{k,l,t,opts,req,hint,full,def}] */
function formHTML(fields, v={}){
  return '<div class="ff">'+fields.map(f=>{
    const val = v[f.k] !== undefined && v[f.k] !== null ? v[f.k] : (f.def!==undefined?f.def:'');
    const cls = 'fld'+(f.full?' full':'');
    if(f.t==='check') return `<label class="${cls}"><span>${esc(f.l)}</span><div class="chk"><input type="checkbox" name="${f.k}" ${val?'checked':''}><span>${esc(f.chkLabel||'Sí')}</span></div>${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</label>`;
    if(f.t==='select') return `<label class="${cls}"><span>${esc(f.l)}</span><select name="${f.k}" ${f.req?'required':''}>${(f.opts||[]).map(o=>{
      const ov2 = typeof o==='object'?o.v:o, ol = typeof o==='object'?o.l:o;
      return `<option value="${esc(ov2)}" ${String(val)===String(ov2)?'selected':''}>${esc(ol)}</option>`;}).join('')}</select>${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</label>`;
    if(f.t==='textarea') return `<label class="${cls}"><span>${esc(f.l)}</span><textarea name="${f.k}">${esc(val)}</textarea></label>`;
    const step = f.t==='number' ? ' step="any"' : '';
    return `<label class="${cls}"><span>${esc(f.l)}</span><input type="${f.t||'text'}" name="${f.k}" value="${esc(val)}"${step} ${f.req?'required':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</label>`;
  }).join('')+'</div>';
}

function openForm({title, fields, values={}, onSave, wide}){
  const m = modal({title, wide, body: formHTML(fields, values),
    actions:`<button class="btn" data-c>Cancelar</button><button class="btn pri" data-s>Guardar</button>`});
  m.querySelector('[data-c]').onclick = closeModal;
  m.querySelector('[data-s]').onclick = ()=>{
    const out={}; let bad=null;
    fields.forEach(f=>{
      const el = m.querySelector(`[name="${f.k}"]`); if(!el) return;
      if(f.t==='check'){ out[f.k]=el.checked; return; }
      let val = el.value.trim();
      if(f.req && !val) bad = bad||f.l;
      out[f.k] = f.t==='number' ? (val===''?0:num(val.replace(',','.'))) : val;
    });
    if(bad){ toast('Falta completar: '+bad, true); return; }
    onSave(out); closeModal();
  };
  m.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.tagName!=='TEXTAREA'){ e.preventDefault(); m.querySelector('[data-s]').click(); }});
}

/* ---------- Tooltip de gráficos ----------
   Cualquier elemento con data-tip (HTML ya escapado al armarlo) muestra un globo al pasar el mouse. */
const tipEl = document.createElement('div'); tipEl.className='tooltip'; document.body.appendChild(tipEl);
document.addEventListener('mouseover', e=>{
  const t=e.target.closest?.('[data-tip]'); if(!t){ tipEl.classList.remove('on'); return; }
  tipEl.innerHTML=t.getAttribute('data-tip'); tipEl.classList.add('on');
});
document.addEventListener('mousemove', e=>{
  if(!tipEl.classList.contains('on')) return;
  const w=tipEl.offsetWidth, h=tipEl.offsetHeight;
  let x=e.clientX+14, y=e.clientY-h-12;
  if(x+w>innerWidth-8) x=e.clientX-w-14;
  if(y<8) y=e.clientY+18;
  tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
});

// Montos abreviados para ejes y tooltips chicos: $ 1,2 M · $ 850 k
function corto(v){
  if(v==null||!isFinite(v)) return '—';
  const a=Math.abs(v), s=v<0?'-':'';
  if(a>=1e9) return s+'$ '+(a/1e9).toFixed(1).replace('.',',')+' MM';
  if(a>=1e6) return s+'$ '+(a/1e6).toFixed(a>=1e7?0:1).replace('.',',')+' M';
  if(a>=1e3) return s+'$ '+Math.round(a/1e3)+' k';
  return s+'$ '+Math.round(a);
}
// Escalones "redondos" para la grilla del eje
function ticks(max, n=4){
  if(max<=0) return [0];
  const paso0=max/n, mag=Math.pow(10,Math.floor(Math.log10(paso0))), f=paso0/mag;
  const paso=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;
  const out=[]; for(let v=0; v<=max+paso*0.001; v+=paso) out.push(v);
  if(out[out.length-1]<max) out.push(out[out.length-1]+paso);
  return out;
}
// Columna con extremo de datos redondeado y base recta
function columna(x,y0,w,h,color){
  if(h<=0.5) return '';
  const r=Math.min(4,w/2,h);
  return `<path d="M${x} ${y0}V${y0-h+r}Q${x} ${y0-h} ${x+r} ${y0-h}H${x+w-r}Q${x+w} ${y0-h} ${x+w} ${y0-h+r}V${y0}Z" fill="${color}"/>`;
}

/* Ingresos y costos por mes (columnas agrupadas, un solo eje) */
/* Columnas agrupadas por mes, un solo eje. defs: [{k, nombre, color}] — cada serie es una propiedad de los puntos */
function graficoColumnas(serie, defs, {alto=300, extraTip=null, aria="Gráfico por mes"}={}){
  if(!serie.length || serie.every(s=>defs.every(d=>!s[d.k]))) return `<div class="empty" style="padding:30px 10px"><p>Sin movimientos en el período.</p></div>`;
  const W=720, H=alto, L=58, R=8, T=10, B=28, ih=H-T-B, n=defs.length;
  const max=Math.max(1,...serie.map(s=>Math.max(...defs.map(d=>s[d.k]||0))));
  const tk=ticks(max), top=tk[tk.length-1];
  const banda=(W-L-R)/serie.length, gap=2, bw=Math.min(22,(banda-14-gap*(n-1))/n);
  const y=v=>T+ih-(v/top)*ih;
  let g=tk.map(v=>`<line class="grilla" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${esc(corto(v))}</text>`).join("");
  g+=`<line class="eje" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/>`;
  serie.forEach((s,i)=>{
    const cx=L+banda*i+banda/2, x0=cx-(bw*n+gap*(n-1))/2;
    defs.forEach((d,j)=>{ g+=columna(x0+j*(bw+gap),T+ih,bw,((s[d.k]||0)/top)*ih,d.color); });
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(s.label)}</text>`;
    const tip=`<b>${esc(s.labelLargo||s.label)}</b>`+defs.map(d=>`<br><i style="background:${d.color}"></i>${esc(d.nombre)} ${esc(money(s[d.k]||0))}`).join("")+(extraTip?extraTip(s):"");
    g+=`<rect x="${L+banda*i}" y="${T}" width="${banda}" height="${ih}" fill="transparent" data-tip="${esc(tip)}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}</svg>
    <div class="legend">${defs.map(d=>`<span><i style="background:${d.color}"></i>${esc(d.nombre)}</span>`).join("")}</div>`;
}
function graficoIngCos(serie){
  return graficoColumnas(serie, [{k:"ing",nombre:"Ingresos cobrados",color:"var(--s-ing)"},{k:"cos",nombre:"Costos directos",color:"var(--s-cos)"}],
    {aria:"Ingresos y costos por mes", extraTip:s=>{ const m=s.ing-s.cos, mp=s.ing>0?m/s.ing*100:null; return `<br>Margen ${esc(money(m))}${mp!=null?" · "+esc(pct(mp)):""}`; }});
}

/* Caja proyectada semana a semana (línea + área, con el cero marcado) */
function graficoCaja(p){
  const pts=[{d:today(),acc:p.saldo0,ini:null},...p.semanas.map(s=>({d:s.fin,acc:s.acc,s}))];
  const W=720, H=220, L=58, R=12, T=12, B=28, ih=H-T-B;
  const vals=pts.map(x=>x.acc), mx=Math.max(0,...vals), mn=Math.min(0,...vals);
  // Un solo paso "redondo" para todo el rango, así los valores negativos no se amontonan
  const t0=ticks(Math.max(mx-mn,1)), paso=t0[1]||1;
  const bot=Math.floor(mn/paso)*paso, top=Math.max(paso,Math.ceil(mx/paso)*paso);
  const tk=[]; for(let v=bot; v<=top+paso*0.001; v+=paso) tk.push(Math.round(v));
  const y=v=>T+ih-((v-bot)/(top-bot))*ih;
  const x=i=>L+(W-L-R)*(i/(pts.length-1||1));
  let g=tk.map(v=>
    `<line class="grilla" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${esc(corto(v))}</text>`).join('');
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--cero)" stroke-width="1"/>`;
  const linea=pts.map((p2,i)=>`${i?'L':'M'}${x(i)} ${y(p2.acc)}`).join('');
  g+=`<path d="${linea}L${x(pts.length-1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="var(--s-ing)" opacity=".1"/>`;
  g+=`<path d="${linea}" fill="none" stroke="var(--s-ing)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p2,i)=>{
    const rojo=p2.acc<0;
    if(rojo || i===pts.length-1 || i===0) g+=`<circle cx="${x(i)}" cy="${y(p2.acc)}" r="4.5" fill="${rojo?'var(--rojo)':'var(--s-ing)'}" stroke="var(--surface)" stroke-width="2"/>`;
    if(i%2===0 || i===pts.length-1) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(fdate(p2.d).slice(0,5))}</text>`;
    const tip = p2.s ? `<b>Semana al ${esc(fdate(p2.d))}</b><br>Cobros ${esc(money(p2.s.inn))}<br>Pagos ${esc(money(p2.s.out))}<br>Saldo ${esc(money(p2.acc))}` : `<b>Hoy</b><br>Saldo de caja ${esc(money(p2.acc))}`;
    const w=(W-L-R)/(pts.length-1||1);
    g+=`<rect x="${x(i)-w/2}" y="${T}" width="${w}" height="${ih}" fill="transparent" data-tip="${esc(tip)}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Caja proyectada">${g}</svg>`;
}

function sparkline(vals,color='var(--s-ing)'){
  if(vals.length<2 || vals.every(v=>!v)) return '';
  const W=96,H=34, mx=Math.max(...vals), mn=Math.min(0,...vals), rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i*(W/(vals.length-1)), H-3-((v-mn)/rg)*(H-6)]);
  const d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
  const u=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"><path d="${d}L${W} ${H}L0 ${H}Z" fill="${color}" opacity=".1"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${u[0]}" cy="${u[1]}" r="3.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/></svg>`;
}
// Variación de los últimos 3 meses contra los 3 anteriores; arriba=bueno salvo que se indique
function deltaChip(serie, malSiSube=false){
  if(serie.length<6) return '';
  const a=serie.slice(-3).reduce((s,v)=>s+v,0), b=serie.slice(-6,-3).reduce((s,v)=>s+v,0);
  if(!b) return '';
  const d=(a-b)/Math.abs(b)*100;
  if(Math.abs(d)<0.5) return `<span class="delta flat" title="Últimos 3 meses contra los 3 anteriores">= 0 %</span>`;
  const bueno = malSiSube ? d<0 : d>0;
  return `<span class="delta ${bueno?'up':'down'}" title="Últimos 3 meses contra los 3 anteriores">${d>0?'▲':'▼'} ${esc(pct(Math.abs(d),0))}</span>`;
}

/* ---------- Series mensuales de los últimos 12 meses ---------- */
function ultimosMeses(n=12){
  const out=[], h=new Date();
  for(let i=n-1;i>=0;i--){ const d=new Date(h.getFullYear(), h.getMonth()-i, 1); out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  return out;
}
function serieMensual(n=12){
  const meses=ultimosMeses(n);
  return meses.map(m=>{
    const ing=D().ingresos.filter(x=>monthKey(x.fecha)===m).reduce((s,x)=>s+num(x.monto),0);
    const cos=D().costos.filter(x=>monthKey(x.fecha)===m).reduce((s,x)=>s+num(x.monto),0);
    return {m, label:monthLabel(m).split(' ')[0], labelLargo:monthLabel(m), ing, cos};
  });
}

/* ---------- Índice de salud financiera (0 a 100) ----------
   Combina cinco factores con pesos fijos; cada uno se lleva a una escala de 0 a 1. */
const lim01 = v => Math.max(0, Math.min(1, v));
function indiceSalud(){
  const c=consolidado(), p=proyectarCaja(90), obj=num(D().config.margenObj)||20;
  if(c.totI<=0) return null;
  const netoPct=c.neto/c.totI*100;
  const ms=(c.eq&&c.promMensual>0)?(c.promMensual-c.eq)/c.promMensual*100:null;
  const ciclo=(c.dso!=null&&c.dpo!=null)?c.dso-c.dpo:null;
  const vivas=c.obras.filter(o=>o.estado!=='Presupuestada');
  const enOrden=vivas.filter(o=>{ const a=analizarObra(o); return a.margen>=0 && !(a.atraso>0) && !(o.estado==='En ejecución'&&o.fechaEntregaPrev&&o.fechaEntregaPrev<today()&&!o.fechaEntrega); }).length;
  const f=[
    {n:'Rentabilidad neta', peso:25, v: lim01((netoPct+20)/(obj+20)), txt: pct(netoPct)},
    {n:'Margen de seguridad', peso:20, v: ms==null?0.5:lim01((ms+50)/70), txt: ms==null?'—':pct(ms)},
    {n:'Caja a 90 días', peso:25, v: p.primeraRoja?0.15:(c.fijoMes>0?lim01(0.4+0.6*p.minimo/c.fijoMes):(p.minimo>0?1:0.5)), txt: p.primeraRoja?'En rojo':corto(p.minimo)+' mín.'},
    {n:'Ciclo de caja', peso:15, v: ciclo==null?0.5:lim01((60-ciclo)/60), txt: ciclo==null?'—':days(ciclo)},
    {n:'Obras en orden', peso:15, v: vivas.length?enOrden/vivas.length:0.5, txt: vivas.length?`${enOrden} de ${vivas.length}`:'—'}
  ];
  const score=Math.round(f.reduce((s,x)=>s+x.v*x.peso,0));
  const estado = score>=75?['Saludable','var(--verde)','g'] : score>=50?['Con alertas','var(--amarillo)','y'] : ['Delicada','var(--rojo)','r'];
  return {score, estado, factores:f};
}
function anillo(score,color){
  const r=56, c=2*Math.PI*r, v=(score??0)/100;
  return `<svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--pista)" stroke-width="11"/>
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(c*v).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}

/* ---------- Alertas automáticas ----------
   Revisa los datos y devuelve lo que la dirección debería mirar, de lo más grave a lo menos. */
function alertas(){
  const out=[], hoy=today(), c=consolidado(), p=proyectarCaja(90);
  const add=(nivel,titulo,detalle,ir)=>out.push({nivel,titulo,detalle,ir});
  if(p.primeraRoja) add('critico', `La caja queda en rojo la semana del ${fdate(p.primeraRoja.ini)}`,
    `Saldo mínimo proyectado ${money(p.minimo)}. Adelantá cobros o reprogramá pagos.`, {v:'caja'});
  if(c.eq && c.promMensual>0 && c.promMensual<c.eq){
    const ms=(c.promMensual-c.eq)/c.promMensual*100;
    add(ms<-30?'critico':'atencion', 'La facturación no cubre la estructura',
      `Se facturan ${money(c.promMensual)} por mes y el punto de equilibrio es ${money(c.eq)} (margen de seguridad ${pct(ms)}).`, {v:'finanzas'});
  }
  D().obras.filter(o=>o.estado!=='Cancelada').forEach(o=>{
    const a=analizarObra(o);
    if(a.costoTot>0 && a.margen<0 && o.estado!=='Presupuestada')
      add('critico', `${o.nombre}: margen negativo`, `Lleva costos por ${money(a.costoTot)} y cobros por ${money(a.cobrado)}.`, {v:'obra',id:o.id});
    if(o.estado==='En ejecución' && o.fechaEntregaPrev && o.fechaEntregaPrev<hoy && !o.fechaEntrega)
      add('atencion', `${o.nombre}: entrega vencida`, `Estaba prevista para el ${fdate(o.fechaEntregaPrev)} (hace ${diffDays(o.fechaEntregaPrev,hoy)} días).`, {v:'obra',id:o.id});
    const ent=o.fechaEntrega;
    if(ent && a.cobrable>0 && diffDays(ent,hoy)>plazoCobroProm()+15)
      add('atencion', `${o.nombre}: saldo sin cobrar`, `Faltan ${money(a.cobrable)} y se entregó hace ${diffDays(ent,hoy)} días.`, {v:'obra',id:o.id});
    if(a.metaRoi>0 && a.metaCumplida===false && o.estado!=='Presupuestada')
      add('atencion', `${o.nombre}: por debajo de la meta`, `ROI ${pct(a.roi)} contra una meta de ${pct(a.metaRoi,0)}.`, {v:'obra',id:o.id});
    const rb=compararRubros(o).filas.filter(f=>f.pre>0 && f.desvPct>10).sort((x,y)=>y.desv-x.desv)[0];
    if(rb) add('atencion', `${o.nombre}: ${rb.rubro} se pasó del presupuesto`, `Lleva ${money(rb.real)} contra ${money(rb.pre)} previstos (+${pct(rb.desvPct)}).`, {v:'obra',id:o.id,tab:'plan'});
  });
  const vencidos=D().costos.filter(x=>!x.pagado && x.vence && x.vence<hoy);
  if(vencidos.length) add('atencion', `${vencidos.length} ${vencidos.length===1?'pago vencido':'pagos vencidos'} a proveedores`,
    `Suman ${money(vencidos.reduce((s,x)=>s+num(x.monto),0))}.`, {v:'caja'});
  const porCli={}; let totCli=0;
  D().obras.forEach(o=>{ const v=analizarObra(o).cobrado; if(v>0){ const k=o.cliente||'Sin cliente'; porCli[k]=(porCli[k]||0)+v; totCli+=v; } });
  const top=Object.entries(porCli).sort((a,b)=>b[1]-a[1])[0];
  if(top && totCli>0 && top[1]/totCli>0.5 && Object.keys(porCli).length>1)
    add('info', 'Ingresos concentrados en un cliente', `${top[0]} explica el ${pct(top[1]/totCli*100,0)} de lo cobrado.`, {v:'obras'});
  const orden={critico:0,atencion:1,info:2};
  return out.sort((a,b)=>orden[a.nivel]-orden[b.nivel]);
}

/* ---------- Gráficos SVG ---------- */
function barChart(series, {h=180, money:isMoney=true}={}){
  // series: [{k:'label', a:number, b:number}] a=ingresos b=costos
  if(!series.length) return `<div class="empty" style="padding:24px"><p>Sin movimientos en el período.</p></div>`;
  const max = Math.max(1, ...series.flatMap(s=>[s.a,s.b]));
  const w = Math.max(series.length*54, 300), pad=26, bw=18, gap=5;
  const bars = series.map((s,i)=>{
    const x = pad + i*((w-pad-8)/series.length);
    const ha = (s.a/max)*(h-40), hb=(s.b/max)*(h-40);
    return `<rect x="${x}" y="${h-24-ha}" width="${bw}" height="${Math.max(ha,1)}" fill="var(--plano)" rx="1"><title>${esc(s.k)} · ingresos ${money(s.a)}</title></rect>
    <rect x="${x+bw+gap}" y="${h-24-hb}" width="${bw}" height="${Math.max(hb,1)}" fill="var(--obra)" rx="1"><title>${esc(s.k)} · costos ${money(s.b)}</title></rect>
    <text x="${x+bw+gap/2}" y="${h-8}" font-size="9.5" fill="var(--muted)" text-anchor="middle" font-family="var(--mono)">${esc(s.k)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" preserveAspectRatio="xMinYMid meet">
    <line x1="${pad-6}" y1="${h-24}" x2="${w}" y2="${h-24}" stroke="var(--line)"/>
    <text x="0" y="14" font-size="9" fill="var(--muted)" font-family="var(--mono)">${money(max)}</text>
    ${bars}</svg>`;
}
function hbars(items,{h=null}={}){
  if(!items.length) return `<div class="empty" style="padding:24px"><p>Sin datos.</p></div>`;
  const max = Math.max(1,...items.map(i=>Math.abs(i.v)));
  return items.map(i=>`<div style="margin-bottom:11px">
    <div class="row" style="gap:8px;margin-bottom:2px"><span style="font-size:12.5px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.k)}</span>
    <span class="mini ${i.cls||''}" style="font-weight:600">${i.lab}</span></div>
    <div class="bar-line"><i style="width:${Math.abs(i.v)/max*100}%;background:${i.color||'var(--obra)'}"></i></div></div>`).join('');
}
// Torta de composición: colores categóricos en orden fijo; más de 8 categorías se agrupan en "Otros"
function donut(items,size=156){
  let it=items.filter(i=>i.v>0);
  if(it.length>8){ const resto=it.slice(7).reduce((s,i)=>s+i.v,0); it=[...it.slice(0,7),{k:"Otros",v:resto}]; }
  const tot=it.reduce((s,i)=>s+i.v,0);
  if(!tot) return `<div class="empty" style="padding:20px"><p>Sin datos cargados.</p></div>`;
  const R=size/2, r=R*0.64; let a=-Math.PI/2, out="";
  it.forEach((x,i)=>{
    const ang=Math.min(x.v/tot*Math.PI*2, Math.PI*2-0.0001), b=a+ang;
    const p=(rad,ang2)=>[R+rad*Math.cos(ang2), R+rad*Math.sin(ang2)];
    const [x1,y1]=p(R,a),[x2,y2]=p(R,b),[x3,y3]=p(r,b),[x4,y4]=p(r,a), la=ang>Math.PI?1:0;
    const tip=`<b>${esc(x.k)}</b><br>${esc(money(x.v))} · ${esc(pct(x.v/tot*100))}`;
    out+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${la} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${la} 0 ${x4} ${y4}Z" fill="var(--c${i+1})" stroke="var(--surface)" stroke-width="2" data-tip="${esc(tip)}"/>`;
    a=b;
  });
  const centro=`<text x="${R}" y="${R-2}" text-anchor="middle" style="font-size:15px;font-weight:600;fill:var(--text)">${esc(corto(tot))}</text><text x="${R}" y="${R+15}" text-anchor="middle" style="font-size:11px;fill:var(--muted)">total</text>`;
  const leg=it.map((x,i)=>`<div class="dato" style="padding:6px 0"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;background:var(--c${i+1})"></i>${esc(x.k)}</span><b>${esc(pct(x.v/tot*100,0))}</b></div>`).join("");
  return `<div class="row" style="gap:22px;align-items:center;flex-wrap:nowrap"><svg class="chart" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none;width:${size}px">${out}${centro}</svg>
    <div style="flex:1;min-width:0">${leg}</div></div>`;
}
// Línea de caja acumulada en el tiempo (eje de tiempo real, cero marcado, tooltip por punto)
function lineChart(pts,{h=230, w=720}={}){
  if(pts.length<2) return `<div class="empty" style="padding:24px"><p>Se necesitan al menos dos movimientos.</p></div>`;
  const W=w, H=h, L=58, R=12, T=12, B=28, ih=H-T-B;
  const ts=pts.map(p=>dt(p.d).getTime()), t0=Math.min(...ts), t1=Math.max(...ts)||t0+1;
  const vals=pts.map(p=>p.acc), mx=Math.max(0,...vals), mn=Math.min(0,...vals);
  const paso=ticks(Math.max(mx-mn,1))[1]||1;
  const bot=Math.floor(mn/paso)*paso, top=Math.max(paso,Math.ceil(mx/paso)*paso);
  const tk=[]; for(let v=bot; v<=top+paso*0.001; v+=paso) tk.push(Math.round(v));
  const X=t=>L+(t-t0)/((t1-t0)||1)*(W-L-R), Y=v=>T+ih-((v-bot)/(top-bot))*ih;
  let g=tk.map(v=>`<line class="grilla" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${esc(corto(v))}</text>`).join("");
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--cero)" stroke-width="1"/>`;
  const d=pts.map((p,i)=>(i?"L":"M")+X(ts[i]).toFixed(1)+" "+Y(p.acc).toFixed(1)).join("");
  g+=`<path d="${d}L${X(ts[ts.length-1]).toFixed(1)} ${Y(0)}L${X(ts[0]).toFixed(1)} ${Y(0)}Z" fill="var(--s-ing)" opacity=".1"/>`;
  g+=`<path d="${d}" fill="none" stroke="var(--s-ing)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const iMin=vals.indexOf(Math.min(...vals));
  pts.forEach((p,i)=>{
    const destacado = i===0 || i===pts.length-1 || i===iMin;
    if(destacado) g+=`<circle cx="${X(ts[i])}" cy="${Y(p.acc)}" r="4.5" fill="${p.acc<0?"var(--rojo)":"var(--s-ing)"}" stroke="var(--surface)" stroke-width="2"/>`;
    g+=`<circle cx="${X(ts[i])}" cy="${Y(p.acc)}" r="10" fill="transparent" data-tip="${esc(`<b>${esc(fdate(p.d))}</b><br>Saldo acumulado ${esc(money(p.acc))}`)}"/>`;
  });
  if(iMin>0 && iMin<pts.length-1 && vals[iMin]<0) g+=`<text x="${X(ts[iMin])}" y="${Y(vals[iMin])+18}" text-anchor="middle" style="fill:var(--rojo);font-weight:600">${esc(corto(vals[iMin]))}</text>`;
  const n=5; for(let k=0;k<n;k++){ const t=t0+(t1-t0)*k/(n-1); g+=`<text x="${X(t)}" y="${H-8}" text-anchor="${k===0?"start":k===n-1?"end":"middle"}">${esc(fdate(new Date(t).toISOString().slice(0,10)))}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Caja acumulada">${g}</svg>`;
}

/* ---------- Regla de plazos (elemento firma) ---------- */
function reglaPlazos(o,a){
  const marks=[];
  if(o.fechaAceptacion) marks.push({d:o.fechaAceptacion,l:'Aceptación',c:'var(--text)',tipo:'hito'});
  if(o.fechaEntregaPrev) marks.push({d:o.fechaEntregaPrev,l:'Entrega prevista',c:'var(--muted-2)',tipo:'hito'});
  if(o.fechaEntrega) marks.push({d:o.fechaEntrega,l:'Entrega real',c:'var(--plano)',tipo:'hito'});
  a.ing.forEach(i=>marks.push({d:i.fecha,l:(i.tipo||'Cobro')+' '+money(i.monto),c:'var(--verde)',tipo:'cobro',m:num(i.monto)}));
  a.cos.filter(c=>c.pagado&&c.fechaPago).forEach(c=>marks.push({d:c.fechaPago,l:'Pago '+money(c.monto),c:'var(--obra)',tipo:'pago',m:num(c.monto)}));
  const valid = marks.filter(m=>m.d);
  if(valid.length<2) return `<div class="regla"><p class="mini">Cargá la fecha de aceptación y al menos un cobro o pago para ver la línea de tiempo.</p></div>`;

  const ts = valid.map(m=>dt(m.d).getTime());
  const min=Math.min(...ts), max=Math.max(...ts), span=(max-min)||DAY;
  const w=760, pad=26;
  const X = t => pad + (t-min)/span*(w-pad*2);
  const totalDias = Math.round(span/DAY);

  // Cada etiqueta se acorta y se ubica en el primer "carril" vertical libre de su lado
  // (arriba: hitos y cobros · abajo: pagos), de modo que nunca se superpone con la anterior.
  const FONT=8.5, CHAR_W=5.1, MAXCH=24;
  const marcados = valid.map(m=>{
    const up = m.tipo!=='pago';
    const x = X(dt(m.d).getTime());
    const label = m.l.length>MAXCH ? m.l.slice(0,MAXCH-1)+'…' : m.l;
    return {...m, up, x, label, half: label.length*CHAR_W/2+5};
  });
  function asignarCarriles(list){
    const ord=[...list].sort((p,q)=>p.x-q.x);
    const bordes=[];
    ord.forEach(it=>{
      const izq=it.x-it.half, der=it.x+it.half;
      let lane=bordes.findIndex(b=>b<izq);
      if(lane===-1){ lane=bordes.length; bordes.push(der); } else bordes[lane]=der;
      it.lane=lane;
    });
    return bordes.length;
  }
  const arriba = marcados.filter(m=>m.up), abajo = marcados.filter(m=>!m.up);
  const lanesArriba = Math.max(asignarCarriles(arriba),1);
  const lanesAbajo = Math.max(asignarCarriles(abajo),1);

  const rowH=14, stub=12, tickH=16;
  const axis = 10 + stub + lanesArriba*rowH;
  const h = axis + stub + tickH + (abajo.length?lanesAbajo*rowH:0) + 12;

  // ticks cada ~ n días
  const step = totalDias>360?90:totalDias>120?30:totalDias>60?15:totalDias>20?7:2;
  let ticks='';
  for(let dd=0; dd<=totalDias; dd+=step){
    const x=X(min+dd*DAY);
    ticks+=`<line x1="${x}" y1="${axis}" x2="${x}" y2="${axis+5}" stroke="var(--line)"/><text x="${x}" y="${axis+tickH-2}" font-size="8" fill="var(--muted-2)" text-anchor="middle" font-family="var(--mono)">${dd}</text>`;
  }
  const body = marcados.map(m=>{
    const y2 = m.up ? axis-stub-m.lane*rowH : axis+stub+tickH+m.lane*rowH;
    const ty = m.up ? y2-3 : y2+8;
    return `<line x1="${m.x}" y1="${axis}" x2="${m.x}" y2="${y2}" stroke="${m.c}" stroke-width="1"/>
      <circle cx="${m.x}" cy="${axis}" r="3.2" fill="${m.c}"/>
      <text x="${m.x}" y="${ty}" font-size="${FONT}" fill="var(--muted)" text-anchor="middle" font-family="var(--mono)">${esc(m.label)}<title>${esc(fdate(m.d)+' · '+m.l)}</title></text>`;
  }).join('');
  return `<div class="regla">
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      <line x1="${pad}" y1="${axis}" x2="${w-pad}" y2="${axis}" stroke="var(--text)" stroke-width="1.4"/>
      ${ticks}${body}
    </svg>

}

/* ---------- Tema claro / oscuro (preferencia de cada equipo) ---------- */
const TEMA_KEY='obracontrol.tema';
const temaPref = ()=>{ try{ return localStorage.getItem(TEMA_KEY)||'auto'; }catch(e){ return 'auto'; } };
function aplicarTema(){
  const p=temaPref(), oscuro = p==='oscuro' || (p==='auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro?'oscuro':'claro';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{ if(temaPref()==='auto'){ aplicarTema(); if(!document.body.classList.contains('bloqueado')) render(); } });
function pintarTema(){
  const ico={auto:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
    claro:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    oscuro:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'};
  const nombres={auto:'Automático (según el sistema)', claro:'Claro', oscuro:'Oscuro'};
  const p=temaPref();
  $('#temaSel').innerHTML=Object.keys(ico).map(k=>`<button data-tema-op="${k}" class="${p===k?'on':''}" title="${nombres[k]}" aria-label="Tema ${nombres[k]}"><svg viewBox="0 0 24 24">${ico[k]}</svg></button>`).join('');
  $('#temaSel').querySelectorAll('[data-tema-op]').forEach(b=>b.onclick=()=>{
    try{ localStorage.setItem(TEMA_KEY,b.dataset.temaOp); }catch(e){}
    aplicarTema(); render();
  });
}

function render(){
  renderNav();
  pintarTema();
  const mail=Cloud.user?.email||'';
  const nombre=mail.split('@')[0].replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  $('#usuario').innerHTML = mail ? `<div class="av">${esc(nombre.split(' ').map(p=>p[0]).join('').slice(0,2)||'?')}</div>

  const t=TITLES[R.v]||['',''];
  $('#crumb').textContent=t[0]; $('#title').textContent=t[1];
  $('#topActions').innerHTML='';
  ({panel:vPanel, obras:vObras, obra:vObra, vehiculos:vVehiculos, vehiculo:vVehiculo, fijos:vFijos, finanzas:vFinanzas, caja:vCaja, informe:vInforme, reporte:vReporte, config:vConfig}[R.v]||vPanel)();
}

   Panel general

function aniosDisponibles(){
  const s=new Set();
  D().ingresos.forEach(x=>x.fecha&&s.add(x.fecha.slice(0,4)));
  D().costos.forEach(x=>x.fecha&&s.add(x.fecha.slice(0,4)));
  return [...s].sort().reverse();
}
const NOMBRES_MES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function enPeriodo(f){
  if(!f) return false;
  const okA = R.filtro.anio==='todos' || f.slice(0,4)===R.filtro.anio;
  const okM = R.filtro.mes==='todos' || f.slice(5,7)===R.filtro.mes;
  return okA && okM;
}

function vPanel(){
  const ing = D().ingresos.filter(x=>enPeriodo(x.fecha));
  const cos = D().costos.filter(x=>enPeriodo(x.fecha));
  const totI = ing.reduce((s,x)=>s+num(x.monto),0);
  const totC = cos.reduce((s,x)=>s+num(x.monto),0);
  const fijoMes = totalFijoMensual();
  const margenBruto = totI-totC;
  const mcPct = totI>0 ? margenBruto/totI*100 : null;

  const c = consolidado();
  const filtrado = R.filtro.anio!=='todos'||R.filtro.mes!=='todos';
  // Sin filtro se usan los mismos meses que Salud financiera, para que todas las pantallas den igual
  const mk = new Set([...ing.map(x=>monthKey(x.fecha)),...cos.map(x=>monthKey(x.fecha))].filter(Boolean));
  const mesesCant = Math.max(1, filtrado ? mk.size : c.mesesOrd.length);
  const fijosPeriodo = fijoMes*mesesCant;
  const resultado = margenBruto - fijosPeriodo;
  const resPct = totI>0 ? resultado/totI*100 : null;
  const equilibrio = (mcPct && mcPct>0) ? fijoMes/(mcPct/100) : null;
  const promMensual = totI/mesesCant;
  const msPct = (equilibrio && promMensual>0) ? (promMensual-equilibrio)/promMensual*100 : null;

  const vivas = D().obras.filter(o=>o.estado!=='Cancelada');
  const porCobrar = vivas.reduce((s,o)=>s+analizarObra(o).cobrable,0);

  const proy = proyectarCaja(90);
  const ciclo = (c.dso!=null&&c.dpo!=null) ? c.dso-c.dpo : null;
  const cobertura = fijoMes>0 ? num(D().config.saldoInicial)/fijoMes : null;
  const serie = serieMensual(12);
  const salud = indiceSalud();
  const lista = alertas();
  const periodoTxt = filtrado ? [R.filtro.mes!=='todos'?NOMBRES_MES[+R.filtro.mes-1]:'', R.filtro.anio!=='todos'?R.filtro.anio:''].filter(Boolean).join(' ') : 'todo el período';

  const hora = new Date().getHours();
  const nombre = (Cloud.user?.email||'').split('@')[0].split(/[._-]/)[0];
  const saludo = (hora<13?'Buen día':hora<20?'Buenas tardes':'Buenas noches') + (nombre?', '+nombre.charAt(0).toUpperCase()+nombre.slice(1):'');
  const fechaLarga = new Date().toLocaleDateString('es-AR',{weekday:'long', day:'numeric', month:'long', year:'numeric'});

  $('#topActions').innerHTML = `<button class="btn pri" id="qIng">${icon('add')} Cargar movimiento</button>`;

  const icoAlerta = {critico:'alerta', atencion:'alerta', info:'info', ok:'ok'};
  const tagAlerta = {critico:'Urgente', atencion:'Revisar', info:'Para saber'};

    .map(o=>({o,a:analizarObra(o)})).sort((x,y)=>y.a.presup-x.a.presup);
  const costosCat = agrupar(cos,'categoria');
  const porCli={}; D().obras.forEach(o=>{ const v=analizarObra(o).cobrado; if(v>0){ const k=o.cliente||'Sin cliente'; porCli[k]=(porCli[k]||0)+v; } });
  const clientes = Object.entries(porCli).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const totCli = clientes.reduce((s,x)=>s+x.v,0);
  const llenoEq = equilibrio ? Math.min(100, promMensual/equilibrio*100) : 0;

  view.innerHTML = `
  <div class="saludo">
    <div><h2>${esc(saludo)}</h2><p>${esc(fechaLarga.charAt(0).toUpperCase()+fechaLarga.slice(1))} · así está la empresa en ${esc(periodoTxt)}.</p></div>
    <div class="filters" style="margin:0">
      <select id="fAnio" aria-label="Año"><option value="todos">Todos los años</option>${aniosDisponibles().map(a=>`<option value="${esc(a)}" ${R.filtro.anio===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
      <select id="fMes" aria-label="Mes"><option value="todos">Todos los meses</option>${NOMBRES_MES.map((n,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${R.filtro.mes===v?'selected':''}>${n}</option>`;}).join('')}</select>
      ${filtrado?`<button class="btn sm" id="fLimpiar">Quitar filtro</button>`:''}
    </div>
  </div>

  <div class="card hero" style="margin-bottom:16px">
    <div class="hero-main">
      <div class="lab">Resultado neto · ${esc(periodoTxt)}</div>
      <div class="big ${sign(resultado)}">${money(resultado)}</div>
      <div class="desc">${totI>0
        ? `Se cobraron <b>${money(totI)}</b> con un margen bruto de <b>${pct(mcPct)}</b>. Después de pagar <b>${money(fijosPeriodo)}</b> de estructura en ${mesesCant} ${mesesCant===1?'mes':'meses'}, ${resultado>=0?'la empresa gana':'la empresa pierde'} <b>${pct(Math.abs(resPct))}</b> de cada peso facturado.`
        : 'Todavía no hay cobros en este período. Cargá obras y movimientos para ver el resultado.'}</div>
      <div class="cascada">
        <div style="border-color:var(--s-ing)"><span>Ingresos</span><b>${money(totI)}</b></div>
        <div style="border-color:var(--s-cos)"><span>Costos directos</span><b>− ${money(totC)}</b></div>
        <div><span>Margen bruto</span><b class="${sign(margenBruto)}">${money(margenBruto)}</b></div>
        <div><span>Estructura</span><b>− ${money(fijosPeriodo)}</b></div>
      </div>
    </div>
    <div class="hero-score">
      ${salud ? `<div class="score">${anillo(salud.score, salud.estado[1])}<div class="n"><b>${salud.score}</b><span>de 100</span></div></div>
      <div class="factores">
        <div><div class="t">Índice de salud financiera</div><span class="chip ${salud.estado[2]}">${esc(salud.estado[0])}</span></div>
        ${salud.factores.map(f=>`<div class="factor" data-tip="${esc(`<b>${esc(f.n)}</b><br>Aporta ${Math.round(f.v*f.peso)} de ${f.peso} puntos`)}"><span>${esc(f.n)}</span><b>${esc(f.txt)}</b>
          <div class="bar-line"><i style="width:${Math.round(f.v*100)}%;background:${f.v>=.7?'var(--verde)':f.v>=.4?'var(--amarillo)':'var(--rojo)'}"></i></div></div>`).join('')}
      </div>` : `<div class="factores" style="grid-column:1/-1"><div class="t">Índice de salud financiera</div><p class="mini">Se calcula cuando haya cobros cargados.</p></div>`}
    </div>
  </div>

  <div class="grid g4" style="margin-bottom:16px">
    <div class="kpi tile acc-b"><div class="lab">Ingresos cobrados</div><div class="val">${money(totI)}</div>
      <div class="fila"><div class="foot">${deltaChip(serie.map(s=>s.ing))||'&nbsp;'} <span>${ing.length} cobros</span></div>${sparkline(serie.map(s=>s.ing),'var(--s-ing)')}</div></div>

      <div class="foot">${proy.primeraRoja?`<span class="chip r">En rojo desde ${esc(fdate(proy.primeraRoja.ini))}</span>`:`Mínimo ${money(proy.minimo)}${cobertura!=null?` · caja actual para ${cobertura.toFixed(1).replace('.',',')} meses de estructura`:''}`}</div></div>
    <div class="kpi tile"><div class="lab">Por cobrar</div><div class="val">${money(porCobrar)}</div>
      <div class="foot">De obras aceptadas · por pagar a proveedores ${money(porPagar)}</div></div>
  </div>

  <div class="grid g21" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h2>Ingresos y costos por mes</h2><span class="sub">últimos 12 meses · pasá el mouse para ver el detalle</span></div>
      <div class="card-b">${graficoIngCos(serie)}</div></div>
    <div class="card"><div class="card-h"><h2>Para mirar hoy</h2><span class="sub">${lista.length?lista.length+' '+(lista.length===1?'tema':'temas'):''}</span></div>
      <div class="card-b alertas">${lista.length ? lista.slice(0,6).map((x,i)=>`<div class="alerta ${x.nivel}" ${x.ir?`data-ir="${i}"`:''}>
          <div class="ic">${icon(icoAlerta[x.nivel])}</div>
          <div><div class="tt">${esc(x.titulo)}</div><div class="dd">${esc(x.detalle)}</div></div>
          <div class="tag">${esc(tagAlerta[x.nivel]||'')}</div></div>`).join('')
        + (lista.length>6?`<p class="mini" style="padding-top:10px;border-top:1px solid var(--line-2)">Y ${lista.length-6} ${lista.length-6===1?'tema':'temas'} más.</p>`:'')
        : `<div class="alerta ok"><div class="ic">${icon('ok')}</div><div><div class="tt">Todo en orden</div><div class="dd">No hay alertas: caja, plazos, márgenes y presupuestos dentro de lo esperado.</div></div><div></div></div>`}</div></div>
  </div>

  <div class="grid g21" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h2>Caja proyectada semana a semana</h2><span class="sub">próximos 90 días · saldo inicial ${money(proy.saldo0)}</span></div>
      <div class="card-b">${graficoCaja(proy)}
        <div class="legend"><span><i style="background:var(--s-ing)"></i>Saldo de caja acumulado</span><span><i style="background:var(--rojo)"></i>Semana en rojo</span></div></div></div>
    <div class="card"><div class="card-h"><h2>Punto de equilibrio</h2><span class="sub">por mes</span></div>
      <div class="card-b">
        ${equilibrio ? `<div class="medidor">
          <div class="mini" style="margin-bottom:8px">Facturación promedio contra la necesaria para cubrir la estructura</div>

          <div class="ejes"><span>Promedio ${money(promMensual)}</span><span>Equilibrio ${money(equilibrio)}</span></div></div>` : '<p class="mini">Se calcula con ingresos, costos y gastos fijos cargados.</p>'}
        <div style="margin-top:14px">
          <div class="dato"><span>Margen de seguridad</span><b class="${msPct==null?'':sign(msPct)}">${msPct!=null?pct(msPct):'—'}</b></div>

      ${obrasActivas.slice(0,8).map(({o,a})=>{ const av=a.presup>0?Math.min(100,a.cobrado/a.presup*100):0;

        return `<tr class="click" data-obra="${esc(o.id)}">
        <td><div class="nombre-obra">${esc(o.nombre)}<small>${esc(o.cliente||'Sin cliente')}</small></div></td>
        <td>${chipEstado(o.estado)}</td>
        <td class="num">${money(a.presup)}</td>
        <td><div class="progreso"><div class="bar-line"><i style="width:${av}%;background:var(--s-ing)"></i></div><span>${Math.round(av)} %</span></div></td>
        <td class="num ${sign(a.margen)}">${money(a.margen)}</td>

        <td>${vencida?`<span class="chip r">Vencida ${esc(fdate(o.fechaEntregaPrev))}</span>`:esc(fdate(o.fechaEntrega||o.fechaEntregaPrev))}</td></tr>`;}).join('')}

  <div class="grid g2">

const ESTADO_COLOR = {'Presupuestada':'b','En ejecución':'o','Entregada':'y','Cobrada':'g','Cancelada':''};
function chipEstado(e){ return `<span class="chip ${ESTADO_COLOR[e]??''}">${esc(e||'—')}</span>`; }

function agrupar(arr, key){
  const m={};
  arr.forEach(x=>{ const k=x[key]||'Sin categoría'; m[k]=(m[k]||0)+num(x.monto); });
  return Object.entries(m).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
}

function menuCarga(){
  const m = modal({title:'¿Qué querés cargar?', body:`<div class="grid" style="gap:9px">
    <button class="btn" data-go="ing" style="justify-content:flex-start;padding:12px">Un ingreso o cobro de una obra</button>
