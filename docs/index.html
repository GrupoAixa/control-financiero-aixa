    <button class="btn" data-go="carga" style="justify-content:flex-start;padding:12px">Una carga de combustible</button>
    <button class="btn" data-go="vg" style="justify-content:flex-start;padding:12px">Un gasto de vehículo</button>
    <button class="btn" data-go="fijo" style="justify-content:flex-start;padding:12px">Un gasto fijo de estructura</button>
  </div>`, actions:`<button class="btn" data-c>Cerrar</button>`});
  m.querySelector('[data-c]').onclick=closeModal;
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{

// Filtros de la lista de obras (se recuerdan mientras la sesión está abierta)
const FO = {estado:'todas', q:''};

function vObras(){
  $('#topActions').innerHTML = `<button class="btn pri" id="nuevaObra">${icon('add')} Nueva obra</button>`;
  $('#nuevaObra').onclick = ()=>formObra(null);

  const todas = D().obras.map(o=>{ const a=analizarObra(o); return {...o,__id:o.id,__a:a}; });
  const activas = todas.filter(r=>r.estado==='En ejecución');
  const cartera = activas.reduce((s,r)=>s+r.__a.presup,0);
  const porCobrar = todas.filter(r=>r.estado!=='Cancelada').reduce((s,r)=>s+r.__a.cobrable,0);
  const conCobro = todas.filter(r=>r.__a.cobrado>0);
  const rentProm = conCobro.length ? conCobro.reduce((s,r)=>s+r.__a.margen,0)/conCobro.reduce((s,r)=>s+r.__a.cobrado,0)*100 : null;
  const hoy=today();
  const conProblemas = todas.filter(r=>r.__a.margen<0&&r.__a.costoTot>0 || (r.estado==='En ejecución'&&r.fechaEntregaPrev&&r.fechaEntregaPrev<hoy&&!r.fechaEntrega)).length;
  const segs = [['todas','Todas'],['Presupuestada','Presupuestadas'],['En ejecución','En ejecución'],['Entregada','Entregadas'],['Cobrada','Cobradas']];

  view.innerHTML = todas.length ? `
  <div class="grid g4" style="margin-bottom:16px">
    ${kpi('Cartera en ejecución', money(cartera), `${activas.length} ${activas.length===1?'obra':'obras'} en marcha`)}
    ${kpi('Saldo por cobrar', money(porCobrar), 'Presupuesto aceptado aún no cobrado')}
    ${kpi('Rentabilidad promedio', rentProm!=null?pct(rentProm):'—', 'Margen sobre lo cobrado, ponderado', rentProm!=null?sign(rentProm):'')}
    ${kpi('Obras con problemas', conProblemas, conProblemas?'Margen negativo o entrega vencida':'Ninguna con margen negativo ni atrasada', conProblemas?'neg':'pos')}
  </div>
  <div class="card">
    <div class="card-h" style="flex-wrap:wrap;gap:10px">
      <div class="segmentos" id="segEstado">${segs.map(([k,l])=>{ const n=k==='todas'?todas.length:todas.filter(r=>r.estado===k).length;
        return `<button data-est="${esc(k)}" class="${FO.estado===k?'on':''}">${esc(l)}<b>${n}</b></button>`; }).join('')}</div>
      <div class="buscar push">${icon('buscar')}<input id="buscarObra" placeholder="Buscar obra o cliente" value="${esc(FO.q)}" aria-label="Buscar obra o cliente"></div>
    </div>
    <div id="tablaObras"></div>
  </div>` : `<div class="card">${emptyBox('Todavía no hay obras','Una obra agrupa su presupuesto, sus cobros y todos sus costos. Es la unidad de análisis del sistema.',
      `<button class="btn pri" data-new>${icon('add')} Crear la primera obra</button>`)}</div>`;

  view.querySelector('[data-new]')?.addEventListener('click',()=>formObra(null));
  if(!todas.length) return;

  const pintar = ()=>{
    const q=FO.q.trim().toLowerCase();
    const rows = todas.filter(r=>(FO.estado==='todas'||r.estado===FO.estado) &&
      (!q || (r.nombre||'').toLowerCase().includes(q) || (r.cliente||'').toLowerCase().includes(q)));
    const tot = rows.reduce((s,r)=>({p:s.p+r.__a.presup, i:s.i+r.__a.cobrado, c:s.c+r.__a.costoTot, m:s.m+r.__a.margen}),{p:0,i:0,c:0,m:0});
    $('#tablaObras').innerHTML = rows.length ? table([
      {h:'Obra', v:r=>`<div class="nombre-obra">${esc(r.nombre)}<small>${esc(r.cliente||'Sin cliente')}</small></div>`},
      {h:'Estado', v:r=>chipEstado(r.estado)},
      {h:'Presupuesto', num:1, v:r=>money(r.__a.presup)},
      {h:'Cobrado', v:r=>{ const av=r.__a.presup>0?Math.min(100,r.__a.cobrado/r.__a.presup*100):0;
        return `<div class="progreso" data-tip="${esc(`<b>${esc(r.nombre)}</b><br>Cobrado ${esc(money(r.__a.cobrado))}<br>Falta ${esc(money(r.__a.cobrable))}`)}"><div class="bar-line"><i style="width:${av}%;background:var(--s-ing)"></i></div><span>${Math.round(av)} %</span></div>`; }},
      {h:'Costos', num:1, v:r=>money(r.__a.costoTot)},
      {h:'Margen', num:1, v:r=>money(r.__a.margen), cls:r=>sign(r.__a.margen)},
      {h:'Rent.', num:1, v:r=>r.__a.rent!=null?pct(r.__a.rent,1):'—', cls:r=>sign(r.__a.rent)},
      {h:'ROI', num:1, v:r=>{ const a=r.__a; if(a.roi==null) return '—';
        const meta = a.metaRoi>0 && a.brechaRoi!=null ? ` <span class="chip ${a.metaCumplida?'g':'r'}" title="Meta ${esc(pct(a.metaRoi,0))}">${a.metaCumplida?'Meta ✓':'Bajo meta'}</span>` : '';
        return pct(a.roi,1)+meta; }, cls:r=>sign(r.__a.roi)},
      {h:'Plazo', num:1, v:r=>{ const a=r.__a;
        if(r.estado==='En ejecución'&&r.fechaEntregaPrev&&r.fechaEntregaPrev<hoy&&!r.fechaEntrega) return `<span class="chip r">Vencida</span>`;
        return a.plazoEjec!=null ? days(a.plazoEjec)+(a.atraso>0?` <span class="neg">(+${a.atraso})</span>`:'') : (r.fechaEntregaPrev?'Entrega '+fdate(r.fechaEntregaPrev):'—'); }}
    ], rows, {actions:true, onRow:true,
      foot:[{v:`Totales · ${rows.length} ${rows.length===1?'obra':'obras'}`},{v:''},{v:money(tot.p),cls:'num'},{v:money(tot.i),cls:'num'},{v:money(tot.c),cls:'num'},
            {v:money(tot.m),cls:'num '+sign(tot.m)},{v:tot.i>0?pct(tot.m/tot.i*100):'—',cls:'num'},{v:tot.c>0?pct(tot.m/tot.c*100):'—',cls:'num'},{v:''},{v:''}]
    }) : `<div class="empty"><div class="t">Sin resultados</div><p>No hay obras que coincidan con el filtro.</p></div>`;
    $('#tablaObras').querySelectorAll('tbody tr').forEach(tr=>{
      tr.addEventListener('click',e=>{
        if(e.target.closest('[data-edit]')) return formObra(Store.get('obras',tr.dataset.id));
        if(e.target.closest('[data-del]')) return delObra(tr.dataset.id);
        go('obra',tr.dataset.id,'resumen');
      });
    });
  };
  pintar();
  view.querySelectorAll('[data-est]').forEach(b=>b.onclick=()=>{ FO.estado=b.dataset.est;
    view.querySelectorAll('[data-est]').forEach(x=>x.classList.toggle('on',x===b)); pintar(); });
  $('#buscarObra').oninput=e=>{ FO.q=e.target.value; pintar(); };
}

function delObra(id){
  const o=Store.get('obras',id);
  const ni=ingresosDe(id).length, nc=costosDe(id).length;
  confirmDel(`Se borrará la obra "${o.nombre}" junto con ${ni} ingresos y ${nc} costos asociados.`, ()=>{
    D().ingresos = D().ingresos.filter(x=>x.obraId!==id);
    D().costos = D().costos.filter(x=>x.obraId!==id);
    Store.del('obras',id); toast('Obra borrada'); if(R.v==='obra') go('obras'); else render();
  });
}

  openForm({title:o?'Editar obra':'Nueva obra', wide:true, values:o||{estado:'Presupuestada',fechaAceptacion:today(),metaRoi:num(D().config.margenObj)||25},
    fields:[
      {k:'nombre', l:'Nombre de la obra', req:1, full:1, ph:'Ej: Ampliación depósito Ruta 8'},
      {k:'cliente', l:'Cliente'},
      {k:'estado', l:'Estado', t:'select', opts:ESTADOS},
      {k:'presupuesto', l:'Monto presupuestado', t:'number', hint:'Lo que se cotizó y el cliente aceptó'},
      {k:'metaRoi', l:'Meta de rentabilidad (ROI %)', t:'number', hint:'Retorno objetivo sobre el costo invertido. Dejalo en 0 si no querés fijar una meta para esta obra.'},
      {k:'ubicacion', l:'Ubicación'},
      {k:'fechaAceptacion', l:'Fecha de aceptación', t:'date', hint:'Arranca el reloj de la obra'},
      {k:'fechaEntregaPrev', l:'Entrega prevista', t:'date'},
      {k:'fechaEntrega', l:'Entrega real', t:'date', hint:'Dejar vacío si todavía no se entregó'},

  const margenPrev = a.presup - c.totPre;
  const bars = c.filas.filter(f=>f.pre>0||f.real>0).map(f=>({
    k:f.rubro, v:f.real, color: f.pre>0 ? (f.real>f.pre?'var(--rojo)':'var(--verde)') : 'var(--muted-2)',
    lab: f.pre>0 ? pct(f.consumo,0)+' del rubro' : 'sin presupuestar', cls: f.pre>0&&f.real>f.pre?'neg':''}));
  return `
  <div class="grid g4" style="margin-bottom:16px">
    ${kpi('Costo presupuestado', money(c.totPre), `${c.filas.filter(f=>f.pre>0).length} rubros cargados`,'','acc-b')}
    ${kpi('Costo real', money(c.totReal), a.presup>0?pct(c.totReal/a.presup*100,0)+' del precio de venta':'—','','acc')}
    ${kpi('Desvío', (c.desv>0?'+':'')+money(c.desv).replace('$ ','$ '), c.desvPct!=null?pct(c.desvPct):'Cargá el presupuesto por rubro', c.desv>0?'neg':'pos')}
    ${kpi('Margen previsto vs real', money(a.margen), `Previsto ${money(margenPrev)}`, sign(a.margen-margenPrev))}
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><h2>Presupuesto de costos por rubro</h2><span class="sub">dónde se te va la plata</span>
      <button class="btn sm push" id="autoPlan">Traer rubros de los costos cargados</button>
      <button class="btn pri sm" id="addPlan">${icon('add')} Agregar rubro</button></div>
    ${table([
      {h:'Rubro', v:r=>`<span style="font-weight:600">${esc(r.rubro)}</span>`},
      {h:'Presupuestado', num:1, v:r=>r.pre?money(r.pre):'—'},
      {h:'Real', num:1, v:r=>money(r.real)},
      {h:'Desvío', num:1, v:r=>r.pre?((r.desv>0?'+':'')+money(r.desv)):'—', cls:r=>r.pre?(r.desv>0?'neg':'pos'):''},
      {h:'Desvío %', num:1, v:r=>r.desvPct!=null?((r.desvPct>0?'+':'')+pct(r.desvPct)):'—', cls:r=>r.desvPct!=null?(r.desvPct>0?'neg':'pos'):''},
      {h:'Consumido', v:r=>r.pre?`<div class="bar-line" style="min-width:90px"><i style="width:${Math.min(r.consumo,100)}%;background:${r.consumo>100?'var(--rojo)':'var(--verde)'}"></i></div><span class="mini">${pct(r.consumo,0)}</span>`:'<span class="chip r">Sin presupuestar</span>'}
    ], c.filas.map(f=>({...f,__id:f.planId})), {actions:true,
      emptyTitle:'Sin presupuesto por rubro', emptyText:'Cargá cuánto pensabas gastar en materiales, mano de obra, subcontratos, etc. Después el sistema compara contra lo que gastaste de verdad.',
      foot:[{v:'Totales'},{v:money(c.totPre),cls:'num'},{v:money(c.totReal),cls:'num'},{v:(c.desv>0?'+':'')+money(c.desv),cls:'num '+(c.desv>0?'neg':'pos')},{v:c.desvPct!=null?pct(c.desvPct):'—',cls:'num'},{v:''},{v:''}]})}
  </div>
  <div class="card"><div class="card-h"><h2>Consumo de cada rubro</h2></div><div class="card-b">${hbars(bars)}</div></div>`;
}

function formPlan(p,obraId){
  const usados=planDe(obraId).filter(x=>!p||x.id!==p.id).map(x=>x.rubro);
  openForm({title:p?'Editar rubro del presupuesto':'Nuevo rubro del presupuesto', values:p||{obraId,rubro:CAT_COSTO.find(c=>!usados.includes(c))||'Otros'},
    fields:[
      {k:'rubro', l:'Rubro', t:'select', opts:CAT_COSTO, full:1, hint:'Tiene que coincidir con la categoría que usás al cargar los costos'},
      {k:'monto', l:'Monto presupuestado', t:'number', req:1, full:1}
    ],
    onSave:v=>{ v.obraId=obraId;
      if(p) Store.upd('planes',p.id,v);
      else if(usados.includes(v.rubro)) return toast('Ese rubro ya está cargado', true);
      else Store.add('planes',v);
      toast('Presupuesto actualizado'); render(); }});
}

function autoPlan(o){
  const ya=planDe(o.id).map(p=>p.rubro);
  const rubros=[...new Set(costosDe(o.id).map(c=>c.categoria||'Sin categoría'))].filter(r=>!ya.includes(r));
  if(!rubros.length) return toast('No hay rubros nuevos para traer');
  rubros.forEach(r=>Store.add('planes',{obraId:o.id,rubro:r,monto:0}));
  toast(rubros.length+' rubros agregados: ahora poné el monto presupuestado de cada uno'); render();
}

function bindTabla(root, col, onEdit, label){
  root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>onEdit(Store.get(col,b.dataset.edit)));
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDel('Se borrará este '+label+'.',()=>{Store.del(col,b.dataset.del);toast('Borrado');render();}));
}

    ${kpi('Costos de la obra', money(a.costoTot), a.presup>0?pct(a.desvioCosto,0)+' del presupuesto':`${a.cos.length} registros`,'','acc')}
    ${kpi('Margen', money(a.margen), a.rent!=null?'Rentabilidad '+pct(a.rent):'—', sign(a.margen))}

  ${metaBanner(a)}

      ${fila('Desvío de plazo', a.atraso!=null?`<span class="${a.atraso>0?'neg':'pos'}">${a.atraso>0?'+':''}${a.atraso} d</span>`:'—')}
      ${fila('Plazo de cobro desde la entrega', days(a.cobroDesdeEntrega))}
      ${fila('Plazo de pago a proveedores', days(a.plazoProv))}
      </tbody></table></div></div>

    <div class="card"><div class="card-h"><h2>Cobranza</h2></div><div class="card-b">
      <div class="mini">Avance de cobro</div>
      <div class="bar-line" style="height:10px"><i style="width:${avance}%"></i></div>
      <div class="row" style="margin-top:6px"><span class="mini">${money(a.cobrado)}</span><span class="mini push">${money(a.presup)}</span></div>
      <div class="sep"></div>
      <table><tbody>
      ${fila('¿Hubo adelanto?', a.adelanto>0?`<span class="chip g">Sí · ${money(a.adelanto)} (${pct(a.pctAdelanto,0)})</span>`:'<span class="chip r">No</span>')}
      ${fila('Saldo por cobrar', money(a.cobrable))}
      ${fila('Desvío de facturación', a.desvio!=null?`<span class="${sign(a.desvio)}">${a.desvio>0?'+':''}${pct(a.desvio)}</span>`:'—')}
      ${fila('Costos impagos', money(a.porPagar))}
      </tbody></table></div></div>
  </div>
  ${o.notas?`<div class="card" style="margin-top:16px"><div class="card-h"><h2>Notas</h2></div><div class="card-b" style="white-space:pre-wrap;font-size:13.5px">${esc(o.notas)}</div></div>`:''}`;
}
function fila(k,v){ return `<tr><td style="color:var(--muted);font-size:12.5px">${k}</td><td class="num" style="font-weight:600">${v}</td></tr>`; }

// Banner ejecutivo: ¿la obra llegó a la rentabilidad (ROI) que le pediste?
function roiCls(a){ return a.metaRoi>0 ? (a.metaCumplida?'pos':'neg') : sign(a.roi); }
function metaBanner(a){
  if(!(a.metaRoi>0)) return '';
  if(a.roi==null) return `<div class="big-note" style="margin-bottom:16px">Meta de rentabilidad fijada en <b>${pct(a.metaRoi,0)}</b> de ROI. Todavía no hay margen para medirla: cargá cobros y costos con fecha.</div>`;
  const puntos = Math.abs(a.brechaRoi).toFixed(1).replace('.',',');
  const monto = money(Math.abs(a.brechaMonto));
  return a.metaCumplida
    ? `<div class="big-note ok" style="margin-bottom:16px"><b>Meta de rentabilidad cumplida.</b> Pediste ${pct(a.metaRoi,0)} de ROI y la obra dio ${pct(a.roi,1)}: ${puntos} puntos por encima del objetivo, equivalentes a ${monto} de margen extra.</div>`
    : `<div class="big-note bad" style="margin-bottom:16px"><b>Meta de rentabilidad no alcanzada.</b> Pediste ${pct(a.metaRoi,0)} de ROI y la obra dio ${pct(a.roi,1)}: ${puntos} puntos por debajo del objetivo, equivalentes a ${monto} de margen que faltó.</div>`;
}

  return `<div class="card"><div class="card-h"><h2>Ingresos de la obra</h2><span class="sub">${money(a.cobrado)} cobrados</span>
    <button class="btn pri sm push" id="addIng">${icon('add')} Cargar ingreso</button></div>
    ${table([
      {h:'Fecha', v:r=>fdate(r.fecha)},
      {h:'Tipo', v:r=>`<span class="chip ${r.tipo==='Adelanto'?'g':'b'}">${esc(r.tipo||'—')}</span>`},
      {h:'Concepto', v:r=>esc(r.concepto||'—')},

function obraDash(o,a){
  const tasa=num(D().config.tasa);
  const brechaTxt = a.brecha==null ? 'Faltan datos de cobros o pagos'
    : a.brecha<0 ? 'Cobrás en promedio '+Math.abs(Math.round(a.brecha))+' días antes de pagar: el ciclo se financia solo.'
    : 'Pagás en promedio '+Math.round(a.brecha)+' días antes de cobrar: estás financiando la obra con capital propio.';
  const fijoDia = totalFijoMensual()/30;
  const cargaFija = a.plazoEjec!=null ? fijoDia*a.plazoEjec : null;
  const margenNeto = cargaFija!=null ? a.margen-cargaFija : null;

  return `
  <div class="grid g4" style="margin-bottom:16px">
    ${kpi('ROI de la obra', a.roi!=null?pct(a.roi):'—', a.metaRoi>0?`Meta ${pct(a.metaRoi,0)} · ${a.metaCumplida?'cumplida':'no alcanzada'}`:'Margen sobre costo invertido', roiCls(a),'acc')}
    ${kpi('VAN', a.van!=null?money(a.van):'—', `Al ${pct(tasa,0)} anual`, sign(a.van))}
    ${kpi('TIR anual', a.tir!=null?pct(a.tir*100):'—', a.tir!=null?(a.tir*100>tasa?'Supera la tasa exigida':'Por debajo de la tasa exigida'):a.tirNota, a.tir!=null?(a.tir*100>tasa?'pos':'neg'):'')}
    ${kpi('Recupero (payback)', days(a.payback), 'Desde el primer movimiento')}
  </div>

  ${metaBanner(a)}

  <div class="grid g4" style="margin-bottom:16px">
    ${kpi('Plazo de cobro', days(a.cobroDesdeAcep), 'Días promedio ponderados desde la aceptación')}
    ${kpi('Plazo de pago', days(a.pagoDesdeAcep), 'Días promedio ponderados desde la aceptación')}
    ${kpi('Brecha de caja', a.brecha!=null?(a.brecha>0?'+':'')+Math.round(a.brecha)+' d':'—', a.brecha!=null?(a.brecha>0?'Financiás vos':'Te financian'):'—', a.brecha!=null?(a.brecha>0?'neg':'pos'):'')}
    ${kpi('Capital de trabajo', money(Math.abs(a.caja.pico)), 'Máximo desembolsado antes de recuperar', a.caja.pico<0?'neg':'')}
  </div>

  <div class="big-note" style="margin-bottom:16px">${esc(brechaTxt)}</div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><h2>Curva de caja acumulada</h2><span class="sub">cuánto dinero puso y recuperó la obra</span></div>
    <div class="card-b">${lineChart(a.caja.pts,{w:1100,h:260})}</div>
  </div>

  <div class="grid g2">
    <div class="card"><div class="card-h"><h2>Rentabilidad</h2></div><div class="card-b"><table><tbody>
      ${fila('Ingresos cobrados', money(a.cobrado))}
      ${fila('Costos directos', money(a.costoTot))}
      ${fila('Margen bruto', `<span class="${sign(a.margen)}">${money(a.margen)}</span>`)}
      ${fila('Rentabilidad sobre venta', a.rent!=null?pct(a.rent):'—')}
      ${fila('Retorno sobre inversión (ROI)', a.roi!=null?pct(a.roi):'—')}
      ${a.metaRoi>0?fila('Meta de rentabilidad (ROI)', pct(a.metaRoi,0)):''}
      ${a.metaRoi>0&&a.brechaRoi!=null?fila('Diferencia vs. la meta', `<span class="${a.metaCumplida?'pos':'neg'}">${a.brechaRoi>=0?'+':''}${pct(a.brechaRoi,1)} · ${a.brechaMonto>=0?'+':''}${money(a.brechaMonto)}</span>`):''}
      ${fila('Estructura absorbida ('+days(a.plazoEjec)+')', cargaFija!=null?money(cargaFija):'—')}
      ${fila('Margen neto estimado', margenNeto!=null?`<span class="${sign(margenNeto)}">${money(margenNeto)}</span>`:'—')}
      ${fila('Markup sobre costo', a.costoTot>0?pct(a.cobrado/a.costoTot*100-100):'—')}
      ${fila('Retorno anualizado sobre capital inmovilizado', a.retAnual!=null?`<span class="${sign(a.retAnual)}">${pct(a.retAnual)}</span>`:'—')}
      ${fila('Duración del ciclo de plata', days(a.diasCiclo))}
    </tbody></table></div></div>

    <div class="card"><div class="card-h"><h2>Cómo se lee</h2></div><div class="card-b" style="font-size:13px;color:var(--muted);line-height:1.6">
      <p><b style="color:var(--text)">Meta de rentabilidad (ROI)</b>: la fijás vos en "Editar obra". El sistema compara el ROI real contra esa meta y te dice si la cumpliste, por cuántos puntos y por cuántos pesos de margen.</p>
      <p style="margin-top:9px"><b style="color:var(--text)">VAN</b>: valor de la obra hoy, descontando cada cobro y cada pago por el tiempo que tardó. Positivo = la obra rindió más que la tasa que le exigís al dinero.</p>
      <p style="margin-top:9px"><b style="color:var(--text)">TIR</b>: la tasa anual que efectivamente rindió la plata puesta en la obra. Compará contra un plazo fijo o el costo de tu financiación.</p>
      <p style="margin-top:9px"><b style="color:var(--text)">Capital de trabajo</b>: el bache máximo de caja. Es la plata que necesitás tener disponible para bancar la obra hasta cobrar.</p>
      <p style="margin-top:9px"><b style="color:var(--text)">Retorno anualizado sobre capital inmovilizado</b>: si en la obra pusiste $1 de tu bolsillo y recuperaste $1,20 en 90 días, tu plata rindió mucho más que ese 20%: este número lo lleva a tasa anual. Es la mejor comparación contra un plazo fijo cuando la TIR no se puede calcular.</p>
      <p style="margin-top:9px"><b style="color:var(--text)">Brecha de caja</b>: diferencia entre cuándo cobrás y cuándo pagás. Negativa es buena: el proveedor y el adelanto financian la obra.</p>
    </div></div>
  </div>`;
}

function vVehiculos(){
  $('#topActions').innerHTML = `<button class="btn pri" id="nuevoV">${icon('add')} Agregar vehículo</button>`;
  $('#nuevoV').onclick=()=>formVehiculo(null);
  const rows = D().vehiculos.map(v=>({...v,__id:v.id,__a:analizarVehiculo(v)}));
  if(!rows.length){
    view.innerHTML=`<div class="card">${emptyBox('Todavía no hay vehículos','Agregá cada camioneta, camión o auto para controlar consumo real, costo por kilómetro y mantenimiento.',
      `<button class="btn pri" data-new>${icon('add')} Agregar el primero</button>`)}</div>`;
    view.querySelector('[data-new]').onclick=()=>formVehiculo(null);
    return;
  }
  const tot = rows.reduce((s,r)=>s+r.__a.total,0);
  const km = rows.reduce((s,r)=>s+r.__a.kmRecorridos,0);
  const litros = rows.reduce((s,r)=>s+r.__a.litros,0);
  const comb = rows.reduce((s,r)=>s+r.__a.gastoComb,0);

  // Gasto mensual de la flota (últimos 12 meses) y su peso sobre lo cobrado en el mismo lapso
  const meses = ultimosMeses(12);
  const serie = meses.map(m=>({m, label:monthLabel(m).split(' ')[0], labelLargo:monthLabel(m),
    comb: D().cargas.filter(c=>monthKey(c.fecha)===m).reduce((s,c)=>s+num(c.importe),0),
    mant: D().vgastos.filter(g=>monthKey(g.fecha)===m).reduce((s,g)=>s+num(g.monto),0)}));
  const flota12 = serie.reduce((s,x)=>s+x.comb+x.mant,0);
  const ing12 = D().ingresos.filter(x=>meses.includes(monthKey(x.fecha))).reduce((s,x)=>s+num(x.monto),0);
  // Precio del litro: primera y última carga de los últimos 12 meses
  const cargas = D().cargas.filter(c=>num(c.litros)>0 && meses.includes(monthKey(c.fecha))).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const pl = c=>num(c.importe)/num(c.litros);
  const varLitro = cargas.length>1 ? (pl(cargas[cargas.length-1])-pl(cargas[0]))/pl(cargas[0])*100 : null;
  // En qué se va la plata: combustible más cada tipo de gasto
  const porTipo = [{k:'Combustible', v:comb}, ...agrupar(D().vgastos,'tipo')].filter(x=>x.v>0).sort((a,b)=>b.v-a.v);

  view.innerHTML = `<div class="grid g4" style="margin-bottom:16px">
    ${kpi('Gasto total de flota', money(tot), `${rows.length} ${rows.length===1?'vehículo':'vehículos'} · ${nf.format(km)} km recorridos`)}
    ${kpi('Costo por kilómetro', km>0?money(tot/km,true):'—', 'Todo incluido: combustible y mantenimiento')}
    ${kpi('Peso sobre lo cobrado', ing12>0?pct(flota12/ing12*100):'—', 'Gasto de flota ÷ cobros de los últimos 12 meses', ing12>0&&flota12/ing12>0.1?'neg':'')}
    ${kpi('Precio del litro', litros>0?money(comb/litros,true):'—', varLitro!=null?`${varLitro>=0?'Subió':'Bajó'} ${pct(Math.abs(varLitro))} en el último año`:'Promedio de las cargas', varLitro!=null&&varLitro>0?'neg':'')}
  </div>
  <div class="grid g21" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h2>Gasto de la flota por mes</h2><span class="sub">últimos 12 meses</span></div>
      <div class="card-b">${graficoColumnas(serie,[{k:'comb',nombre:'Combustible',color:'var(--c1)'},{k:'mant',nombre:'Mantenimiento y otros',color:'var(--c2)'}],{alto:260,aria:'Gasto de flota por mes'})}</div></div>
    <div class="card"><div class="card-h"><h2>En qué se va la plata</h2><span class="sub">acumulado</span></div>
      <div class="card-b">${donut(porTipo,140)}</div></div>
  </div>
  <div class="card"><div class="card-h"><h2>Vehículos</h2><span class="sub">tocá una fila para ver el detalle</span></div>
  ${table([
    {h:'Vehículo', v:r=>`<div class="nombre-obra">${esc(r.nombre)}<small>${esc(r.patente||'sin patente')} · ${esc(r.marca||'')} ${esc(r.modelo||'')}</small></div>`},
    {h:'Km recorridos', num:1, v:r=>r.__a.kmRecorridos?nf.format(r.__a.kmRecorridos)+' km':'—'},
    {h:'Consumo', num:1, v:r=>r.__a.consumo?r.__a.consumo.toFixed(2).replace('.',',')+' km/l':'—'},
    {h:'Combustible', num:1, v:r=>money(r.__a.gastoComb)},
    {h:'Otros gastos', num:1, v:r=>money(r.__a.gastoOtros)},
    {h:'Costo por km', num:1, v:r=>r.__a.costoKm?money(r.__a.costoKm,true):'—'},
    {h:'Participación', v:r=>{ const p=tot>0?r.__a.total/tot*100:0;
      return `<div class="progreso"><div class="bar-line"><i style="width:${p}%;background:var(--c2)"></i></div><span>${Math.round(p)} %</span></div>`; }},
    {h:'Total', num:1, v:r=>money(r.__a.total)}
  ], rows, {actions:true, onRow:true})}</div>`;

  view.querySelectorAll('tbody tr').forEach(tr=>tr.addEventListener('click',e=>{
    if(e.target.closest('[data-edit]')) return formVehiculo(Store.get('vehiculos',tr.dataset.id));
    if(e.target.closest('[data-del]')) return delVehiculo(tr.dataset.id);
    go('vehiculo',tr.dataset.id,'combustible');
  }));
}

    D().vgastos=D().vgastos.filter(g=>g.vehiculoId!==id);

function vVehiculo(){
  const v=Store.get('vehiculos',R.id); if(!v) return go('vehiculos');
  const a=analizarVehiculo(v);
  const tab=R.tab||'combustible';
  $('#crumb').textContent='Vehículo'; $('#title').textContent=v.nombre+(v.patente?' · '+v.patente:'');
  $('#topActions').innerHTML=`<button class="btn" id="volverV">${icon('back')} Vehículos</button>
    <button class="btn" id="editV">${icon('edit')} Editar</button><button class="btn dgr" id="delV">${icon('del')}</button>`;
  $('#volverV').onclick=()=>go('vehiculos'); $('#editV').onclick=()=>formVehiculo(v); $('#delV').onclick=()=>delVehiculo(v.id);

  const tabs=[['combustible','Combustible'],['gastos','Gastos y mantenimiento'],['dash','Indicadores']];
  view.innerHTML=`<div class="grid g4" style="margin-bottom:16px">
    ${kpi('Km recorridos', a.kmRecorridos?nf.format(a.kmRecorridos)+' km':'—', 'Entre la primera y la última carga')}
    ${kpi('Consumo promedio', a.consumo?a.consumo.toFixed(2).replace('.',',')+' km/l':'—', a.l100?a.l100.toFixed(1).replace('.',',')+' litros cada 100 km':'Cargá al menos 2 cargas con odómetro','','acc')}
    ${kpi('Costo por km', a.costoKm?money(a.costoKm,true):'—', 'Todo incluido')}
    ${kpi('Gasto total', money(a.total), `${money(a.gastoComb)} combustible + ${money(a.gastoOtros)} otros`)}
  </div>
  <div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div><div id="tabBody"></div>`;
  view.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{R.tab=b.dataset.tab;vVehiculo();});
  const body=$('#tabBody');

  if(tab==='combustible'){
    const rows=[...a.cargas].sort((x,y)=>y.fecha<x.fecha?-1:1).map((c,i,arr)=>{
      const prev=arr[i+1];
      const km = prev && num(c.odometro) && num(prev.odometro) ? num(c.odometro)-num(prev.odometro) : null;
      return {...c,__id:c.id,__km:km,__cons: km&&num(c.litros)? km/num(c.litros):null};
    });
    body.innerHTML=`<div class="card"><div class="card-h"><h2>Cargas de combustible</h2><span class="sub">${a.litros.toFixed(0)} litros · ${money(a.gastoComb)}</span>
      <button class="btn pri sm push" id="addCarga">${icon('add')} Cargar combustible</button></div>
      ${table([
        {h:'Fecha', v:r=>fdate(r.fecha)},
        {h:'Odómetro', num:1, v:r=>num(r.odometro)?nf.format(num(r.odometro))+' km':'—'},
        {h:'Km del tramo', num:1, v:r=>r.__km?nf.format(r.__km):'—'},
        {h:'Litros', num:1, v:r=>num(r.litros)?nf2.format(num(r.litros)):'—'},
        {h:'Consumo tramo', num:1, v:r=>r.__cons?r.__cons.toFixed(2).replace('.',',')+' km/l':'—'},
        {h:'$/litro', num:1, v:r=>num(r.litros)?money(num(r.importe)/num(r.litros),true):'—'},
        {h:'Importe', num:1, v:r=>money(r.importe)},
        {h:'Obra', v:r=>{const o=Store.get('obras',r.obraId); return o?esc(o.nombre):'—';}}
      ], rows, {actions:true, emptyTitle:'Sin cargas registradas',
        emptyText:'Anotá fecha, odómetro, litros e importe. Con dos cargas ya se calcula el consumo real.'})}</div>`;
    body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>formCarga(Store.get('cargas',b.dataset.edit),v.id));
    body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDel('Se borrará esta carga de combustible.',()=>{
      const c=Store.get('cargas',b.dataset.del); if(c&&c.costoId) Store.del('costos',c.costoId);
      Store.del('cargas',b.dataset.del); toast('Borrado'); render();
    }));
    $('#addCarga').onclick=()=>formCarga(null,v.id);
  }
  if(tab==='gastos'){
    const rows=[...a.gastos].sort((x,y)=>y.fecha<x.fecha?-1:1).map(g=>({...g,__id:g.id}));
    body.innerHTML=`<div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Gastos del vehículo</h2><span class="sub">${money(a.gastoOtros)}</span>
      <button class="btn pri sm push" id="addVG">${icon('add')} Cargar gasto</button></div>
      ${table([
        {h:'Fecha', v:r=>fdate(r.fecha)},
        {h:'Tipo', v:r=>`<span class="chip">${esc(r.tipo||'—')}</span>`},
        {h:'Detalle', v:r=>esc(r.detalle||'—')},
        {h:'Odómetro', num:1, v:r=>num(r.odometro)?nf.format(num(r.odometro))+' km':'—'},
        {h:'Monto', num:1, v:r=>money(r.monto)}
      ], rows, {actions:true, emptyTitle:'Sin gastos cargados',
        emptyText:'Peajes, service, cubiertas, VTV, seguro, patente, reparaciones y repuestos.'})}</div>
      <div class="card"><div class="card-h"><h2>Gastos por tipo</h2></div><div class="card-b">${donut(agrupar(a.gastos,'tipo'))}</div></div>`;
    bindTabla(body,'vgastos',x=>formVGasto(x,v.id),'gasto');
    $('#addVG').onclick=()=>formVGasto(null,v.id);
  }
  if(tab==='dash'){

function puntoEquilibrio(){
  const totI=D().ingresos.reduce((s,x)=>s+num(x.monto),0);
  const totC=D().costos.reduce((s,x)=>s+num(x.monto),0);
  if(totI<=0) return null;
  const mc=(totI-totC)/totI;
  if(mc<=0) return null;
  return totalFijoMensual()/mc;
}

/* =========================================================
   Salud financiera (consolidado)
   ========================================================= */
// Indicadores consolidados de la empresa: los usa la pantalla de Salud financiera y el informe con IA
function consolidado(){
  const tasa=num(D().config.tasa);
  const obras=D().obras.filter(o=>o.estado!=='Cancelada');
  const flows=[];
  obras.forEach(o=>flujosObra(o).forEach(f=>flows.push(f)));
  // La estructura también consume caja: se imputa mensualmente
  const fijoMes=totalFijoMensual();
  const mesesSet=new Set(flows.map(f=>monthKey(f.d)).filter(Boolean));
  const mesesOrd=[...mesesSet].sort();
  const flowsConFijos=[...flows];
  if(fijoMes>0) mesesOrd.forEach(m=>flowsConFijos.push({d:m+'-28', m:-fijoMes, t:'f'}));

  const totI=flows.filter(f=>f.m>0).reduce((s,f)=>s+f.m,0);
  const totC=-flows.filter(f=>f.m<0).reduce((s,f)=>s+f.m,0);
  const fijosTot=fijoMes*Math.max(mesesOrd.length,1);
  const bruto=totI-totC, neto=bruto-fijosTot;
  const caja=curvaCaja(flowsConFijos);
  const van=flowsConFijos.length>1?xnpv(tasa/100,flowsConFijos):null;
  const tir=xirr(flowsConFijos);

  // Plazos consolidados
  let smC=0,sdC=0,smP=0,sdP=0;
  obras.forEach(o=>{
    ingresosDe(o.id).forEach(i=>{const d=diffDays(o.fechaAceptacion,i.fecha),m=num(i.monto); if(d!=null&&m>0){smC+=m;sdC+=m*d;}});
    costosDe(o.id).filter(c=>c.pagado&&c.fechaPago).forEach(c=>{const d=diffDays(c.fecha,c.fechaPago),m=num(c.monto); if(d!=null&&m>0){smP+=m;sdP+=m*d;}});
  });
  const dso=smC>0?sdC/smC:null, dpo=smP>0?sdP/smP:null;

  const rank=obras.map(o=>{const a=analizarObra(o);return {o,a};}).filter(x=>x.a.cobrado>0||x.a.costoTot>0);
  const mejores=[...rank].sort((x,y)=>(y.a.rent??-999)-(x.a.rent??-999));
  const eq=puntoEquilibrio();
  const promMensual=mesesOrd.length?totI/mesesOrd.length:0;
  const liquidez=totC>0?totI/totC:null;
  return {tasa,obras,flows,fijoMes,mesesOrd,totI,totC,fijosTot,bruto,neto,caja,van,tir,dso,dpo,rank,mejores,eq,promMensual,liquidez};
}

function semaforo(rows){
  return `<table><tbody>${rows.map(([k,v,obj,u,inv])=>{
    const ok = v==null?null:(inv? v<=obj : v>=obj);
    // Mismo formato que el resto de la app: 36,4 % · 27 d · 1,57
    const fmt = x => u==='x' ? x.toFixed(2).replace('.',',') : u==='%' ? pct(x) : u===' d' ? days(x) : String(x);
    return `<tr><td style="font-size:13px">${k}</td>
      <td class="num" style="font-weight:600">${v==null?'—':fmt(v)}</td>
      <td class="num mini">${inv?'objetivo hasta':'objetivo'} ${fmt(obj)}</td>
      <td class="act">${ok==null?'<span class="chip">Sin datos</span>':ok?'<span class="chip g">En objetivo</span>':'<span class="chip r">Bajo objetivo</span>'}</td></tr>`;
  }).join('')}</tbody></table>`;
}

/* =========================================================
   Informe financiero con IA
   La app arma un resumen con los indicadores ya calculados y lo manda
   a /api/informe-financiero (Vercel), que es quien habla con Claude.
   ========================================================= */
const r0 = v => v==null||!isFinite(v) ? null : Math.round(v);
const r1 = v => v==null||!isFinite(v) ? null : Math.round(v*10)/10;
const sinVacios = o => Object.fromEntries(Object.entries(o).filter(([,v])=>v!==null&&v!==undefined&&v!==''&&!(Array.isArray(v)&&!v.length)));

function datosParaIA(inflacion){
  const c=consolidado(), cfg=D().config;
  const coef = c.totI>0 ? c.totC/c.totI : null;
  // Serie mensual con el mismo criterio que el consolidado: cobros por fecha de cobro, costos por fecha de pago
  const meses={};
  c.flows.forEach(f=>{ const mk=monthKey(f.d); if(!mk) return; const m=(meses[mk]=meses[mk]||{mes:mk,ingresos:0,costos:0});
    if(f.m>0) m.ingresos+=f.m; else m.costos-=f.m; });
  const estructura={};
  D().fijos.filter(f=>f.activo!==false).forEach(f=>{ const k=f.categoria||'Otros'; estructura[k]=(estructura[k]||0)+fijoMensual(f); });
  const p=proyectarCaja(90);
  return sinVacios({
    hoy: today(),
    incluye_datos_de_ejemplo: hayDemo() || undefined,
    empresa: sinVacios({nombre:cfg.empresa, tasa_descuento_anual_pct:num(cfg.tasa), margen_neto_objetivo_pct:num(cfg.margenObj),
      saldo_caja_inicial:r0(num(cfg.saldoInicial)), inflacion_periodo_pct: inflacion!=null ? r1(inflacion) : null}),
    consolidado: sinVacios({ingresos_cobrados:r0(c.totI), costos_directos:r0(c.totC), gastos_estructura_periodo:r0(c.fijosTot),
      margen_bruto:r0(c.bruto), margen_bruto_pct:c.totI>0?r1(c.bruto/c.totI*100):null, resultado_operativo:r0(c.neto),
      rentabilidad_neta_pct:c.totI>0?r1(c.neto/c.totI*100):null, van:r0(c.van), tir_pct:c.tir!=null?r1(c.tir*100):null,
      capital_trabajo_requerido:r0(Math.abs(c.caja.pico)), meses_con_actividad:c.mesesOrd.length, obras_analizadas:c.obras.length}),
    economicos: sinVacios({punto_equilibrio_mensual:r0(c.eq), facturacion_mensual_promedio:r0(c.promMensual),
      margen_seguridad_pct:(c.eq&&c.promMensual>0)?r1((c.promMensual-c.eq)/c.promMensual*100):null,
      coeficiente_variabilidad:coef!=null?Math.round(coef*1000)/1000:null, margen_contribucion_pct:coef!=null?r1((1-coef)*100):null,
      estructura_mensual:r0(c.fijoMes)}),
    financieros: sinVacios({plazo_cobro_desde_aceptacion_dias:r0(c.dso), plazo_cobro_desde_entrega_dias:plazoCobroProm(),
      plazo_pago_proveedores_dias:r0(c.dpo), ciclo_caja_dias:(c.dso!=null&&c.dpo!=null)?r0(c.dso-c.dpo):null,
      cobertura_costos:c.liquidez!=null?Math.round(c.liquidez*100)/100:null,
      costos_impagos:r0(D().costos.filter(x=>!x.pagado).reduce((s,x)=>s+num(x.monto),0))}),
    mensual: Object.values(meses).sort((a,b)=>a.mes<b.mes?-1:1).slice(-24).map(m=>({mes:m.mes, ingresos:r0(m.ingresos), costos:r0(m.costos)})),
    obras: D().obras.map(o=>{ const a=analizarObra(o), rb=compararRubros(o);
      return sinVacios({nombre:o.nombre, cliente:o.cliente, estado:o.estado, aceptacion:o.fechaAceptacion, entrega_prevista:o.fechaEntregaPrev,
        entrega_real:o.fechaEntrega, presupuesto:r0(a.presup), cobrado:r0(a.cobrado), costo:r0(a.costoTot), margen:r0(a.margen),
        rentabilidad_pct:r1(a.rent), roi_pct:r1(a.roi), meta_roi_pct:a.metaRoi||null, van:r0(a.van), tir_pct:a.tir!=null?r1(a.tir*100):null,
        atraso_dias:a.atraso, desvio_facturacion_pct:r1(a.desvio), adelanto_pct:r1(a.pctAdelanto), por_cobrar:r0(a.cobrable),
        por_pagar:r0(a.porPagar), plazo_cobro_desde_entrega_dias:r0(a.cobroDesdeEntrega), plazo_pago_proveedores_dias:r0(a.plazoProv),
        capital_inmovilizado_max:a.caja.pico<0?r0(-a.caja.pico):null,
        rubros: rb.filas.map(f=>sinVacios({rubro:f.rubro, presupuestado:r0(f.pre)||null, real:r0(f.real), desvio_pct:r1(f.desvPct)}))});
    }),
    estructura: Object.entries(estructura).map(([categoria,m])=>({categoria, mensual:r0(m)})).sort((a,b)=>b.mensual-a.mensual),
    vehiculos: D().vehiculos.map(v=>{ const a=analizarVehiculo(v);
      return sinVacios({nombre:v.nombre, gasto_total:r0(a.total), combustible:r0(a.gastoComb), otros:r0(a.gastoOtros),
        km:r0(a.kmRecorridos)||null, costo_por_km:r1(a.costoKm), consumo_km_l:r1(a.consumo)}); }),
    caja_proyectada: sinVacios({saldo_inicial:r0(p.saldo0), cobros_90d:r0(p.totalIn), pagos_90d:r0(p.totalOut), saldo_final:r0(p.final),
      saldo_minimo:r0(p.minimo), primera_semana_en_rojo:p.primeraRoja?p.primeraRoja.ini:null,
      semanas:p.semanas.map(s=>({desde:s.ini, cobros:r0(s.inn), pagos:r0(s.out), saldo:r0(s.acc)}))})
  });
}

// Generación en curso: sobrevive a cambiar de pantalla mientras Claude trabaja
let informeEnCurso = null;

async function generarInforme(inflacion, foco){
  if(informeEnCurso) return;
  informeEnCurso = {desde:Date.now()};
  render();
  try{
    const token = await Cloud.user.getIdToken();
    const r = await fetch('/api/informe-financiero', {method:'POST',
      headers:{'Content-Type':'application/json', Authorization:'Bearer '+token},
      body: JSON.stringify({datos:datosParaIA(inflacion), foco})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || (r.status===404
      ? 'El servidor de informes no está disponible: el sitio tiene que estar publicado en Vercel.'
      : 'Error del servidor ('+r.status+').'));
    const nuevo = {id:uid(), generado:j.generado, autor:(Cloud.user?.email||'').split('@')[0], foco:foco||'', inflacion, informe:j.informe};
    Store.data.informes = [nuevo, ...D().informes].slice(0,12);   // se guardan los últimos 12 para todos los usuarios
    Store.save();
    R.id = nuevo.id;
    toast('Informe listo');
  }catch(e){
    toast(e.message || 'No se pudo generar el informe', true);
  }finally{
    informeEnCurso = null;
    if(R.v==='informe') render();
  }
}

    ${seccion('Rentabilidad', parrafo(inf.rentabilidad))}

    ${seccion('Estructura y costos', parrafo(inf.estructura_y_costos))}
    <div class="grid g2">
      ${seccion('Riesgos', lista(inf.riesgos,'No se detectan riesgos relevantes.'))}
      ${seccion('Oportunidades', lista(inf.oportunidades,'Sin oportunidades destacadas.'))}

    ${seccion('Datos que faltan para un análisis más completo', lista(inf.datos_faltantes,'Nada relevante.'))}

let mesReporte = null;   // mes elegido (AAAA-MM); por defecto, el último con movimientos

function datosMes(m){
  const ing=D().ingresos.filter(x=>monthKey(x.fecha)===m), cos=D().costos.filter(x=>monthKey(x.fecha)===m);
  const I=ing.reduce((s,x)=>s+num(x.monto),0), C=cos.reduce((s,x)=>s+num(x.monto),0), F=totalFijoMensual();
  return {ing,cos,I,C,F,margen:I-C,res:I-C-F,mc:I>0?(I-C)/I*100:null};
}
function mesAnterior(m){ const [y,mm]=m.split('-').map(Number); const d=new Date(y,mm-2,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

    const d=(x-y)/Math.abs(y)*100; if(Math.abs(d)<0.5) return '<span class="delta flat">= 0 %</span>';
    const bueno=malSiSube?d<0:d>0; return `<span class="delta ${bueno?'up':'down'}" title="Contra el mes anterior">${d>0?'▲':'▼'} ${esc(pct(Math.abs(d),0))}</span>`; };
  // Obras con movimientos en el mes
  const obrasMes = D().obras.map(o=>{
    const ci=a.ing.filter(x=>x.obraId===o.id).reduce((s,x)=>s+num(x.monto),0);
    const cc=a.cos.filter(x=>x.obraId===o.id).reduce((s,x)=>s+num(x.monto),0);
    return {o, ci, cc, an:analizarObra(o)};
  }).filter(x=>x.ci||x.cc).sort((x,y)=>(y.ci+y.cc)-(x.ci+x.cc));

  $('#topActions').innerHTML=`<button class="btn dark" id="repPrint">${icon('imprimir')} Imprimir o guardar PDF</button>`;
  view.innerHTML=`

    <span class="mini">Para guardarlo como PDF, en la ventana de impresión elegí "Guardar como PDF".</span>
  </div>
  <article class="reporte" id="reporte">
    <header class="rep-h">
      <div class="row" style="gap:14px;flex-wrap:nowrap"><img src="logo-aixa.png" alt="AIXA">

function exportar(sufijo, datos=Store.data){
  const blob=new Blob([JSON.stringify(datos,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='control-financiero-aixa-'+today()+(sufijo?'-'+sufijo:'')+'.json';
  a.click(); URL.revokeObjectURL(a.href); toast('Respaldo descargado');
}
function exportarCSV(){
  const nombre=id=>Store.get('obras',id)?.nombre||'';
  const lines=[['Tipo','Obra','Fecha','Categoria/Tipo','Concepto','Proveedor/Medio','Pagado','FechaPago','Monto']];
  D().ingresos.forEach(x=>lines.push(['Ingreso',nombre(x.obraId),x.fecha,x.tipo,x.concepto,x.medio,'','',num(x.monto)]));
  D().costos.forEach(x=>lines.push(['Costo',nombre(x.obraId),x.fecha,x.categoria,x.concepto,x.proveedor,x.pagado?'Si':'No',x.fechaPago||'',num(x.monto)]));
  D().vgastos.forEach(x=>lines.push(['Vehículo',Store.get('vehiculos',x.vehiculoId)?.nombre||'',x.fecha,x.tipo,x.detalle,'','','',num(x.monto)]));
  D().cargas.forEach(x=>lines.push(['Combustible',Store.get('vehiculos',x.vehiculoId)?.nombre||'',x.fecha,'Carga',x.litros+' l',x.estacion||'','','',num(x.importe)]));
  D().fijos.forEach(x=>lines.push(['Gasto fijo','',x.desde||'',x.categoria,x.concepto,x.periodicidad,'','',num(x.monto)]));
  // Un texto que empieza con = + - @ Excel lo toma como f\u00F3rmula: se antepone ' para que quede como texto
  const celda=c=>{ if(typeof c==='number') return String(c); let s=String(c??''); if(/^[=+\-@\t\r]/.test(s)) s="'"+s; return `"${s.replace(/"/g,'""')}"`; };
  const csv='\uFEFF'+lines.map(r=>r.map(celda).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='control-financiero-aixa-'+today()+'.csv'; a.click(); URL.revokeObjectURL(a.href); toast('CSV descargado');
}

// Reconoce lo de ejemplo: por la marca, o por su contenido exacto si se cargó antes de que existiera la marca
function idsDemo(){
  const obras=new Set(D().obras.filter(o=>o.demo ||
    (o.nombre==='Ampliación depósito Ruta 8'&&o.cliente==='Logística del Sur') ||
    (o.nombre==='Playón hormigón Parque Industrial'&&o.cliente==='Metalúrgica Rivas')).map(o=>o.id));
  const vehic=new Set(D().vehiculos.filter(v=>v.demo || (v.nombre==='Hilux blanca'&&v.patente==='AB123CD')).map(v=>v.id));
  const fijos=['Alquiler del galpón|850000','Sueldo administración|920000','Contador|180000',
    'Seguro de responsabilidad civil|420000','Luz, agua e internet|210000','Ingresos brutos y tasas|260000'];
  const es={
    obras:x=>obras.has(x.id), vehiculos:x=>vehic.has(x.id),
    ingresos:x=>obras.has(x.obraId), costos:x=>obras.has(x.obraId), planes:x=>obras.has(x.obraId), previsiones:x=>obras.has(x.obraId),
    cargas:x=>vehic.has(x.vehiculoId), vgastos:x=>vehic.has(x.vehiculoId),
    fijos:x=>fijos.includes(x.concepto+'|'+num(x.monto))
  };
  return (col,x)=> !!x.demo || !!(es[col]&&es[col](x));
}
const hayDemo = ()=>{ const esDemo=idsDemo(); return COLS.some(k=>D()[k].some(x=>esDemo(k,x))); };
function borrarDemo(){
  const esDemo=idsDemo();
  COLS.forEach(k=>{ Store.data[k]=Store.data[k].filter(x=>!esDemo(k,x)); });
  if(D().config.saldoDemo){ D().config.saldoInicial=0; delete D().config.saldoDemo; }
  Store.save();
  toast('Datos de ejemplo borrados'); go('panel');
}
